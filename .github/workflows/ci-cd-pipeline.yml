name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests (emergency release only)'
        required: false
        default: false
        type: boolean
      build_windows:
        description: 'Build Windows executable'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ZIG_VERSION: '0.13.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cauc-sep/backend
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: cauc-sep/backend/requirements*.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install black ruff mypy isort
      
      - name: Black check
        run: black --check --diff --color --line-length 100 .
      
      - name: isort check
        run: isort --check-only --diff --profile black .
      
      - name: Ruff check
        run: ruff check --output-format=github .
      
      - name: MyPy check
        run: mypy --config-file pyproject.toml --no-error-summary core/ api/ || true
        continue-on-error: true

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cauc-sep/frontend
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cauc-sep/frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: ESLint check
        run: npm run lint:check 2>&1 || true
        continue-on-error: true
      
      - name: Prettier check
        run: npx prettier --check "src/**/*.{js,vue,css,scss,json}" || true
        continue-on-error: true

  backend-test:
    name: Backend Test
    runs-on: ${{ matrix.os }}
    needs: backend-lint
    if: ${{ !inputs.skip_tests }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11']
    
    defaults:
      run:
        working-directory: cauc-sep/backend
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: cauc-sep/backend/requirements*.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest-cov pytest-asyncio pytest-xdist
      
      - name: Run unit tests
        run: |
          pytest tests/unit -v -n auto \
            --cov=core --cov=api \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=html:htmlcov-unit \
            --cov-fail-under=0 \
            -m "not slow and not integration and not windows" \
            --junitxml=junit-unit.xml || true
        continue-on-error: true
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: cauc-sep/backend/coverage-unit.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    needs: frontend-lint
    if: ${{ !inputs.skip_tests }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cauc-sep/frontend
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cauc-sep/frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: Run tests
        run: npm run test:coverage || true
        continue-on-error: true
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: cauc-sep/frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: always() && (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped')
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    
    outputs:
      backend_tag: ${{ steps.meta-backend.outputs.tags }}
      frontend_tag: ${{ steps.meta-frontend.outputs.tags }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo "v0.0.0-$(git rev-parse --short HEAD)")"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./cauc-sep/backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
      
      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./cauc-sep/frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
      
      - name: Build summary
        run: |
          echo "## Docker Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY

  build-windows-exe:
    name: Build Windows EXE (Nuitka)
    runs-on: windows-latest
    needs: build-docker
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_windows == 'true'))
    timeout-minutes: 240
    permissions:
      contents: write
    
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      build_status: ${{ steps.build-status.outputs.status }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version
        id: get-version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v') {
            $VERSION = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $VERSION = "v0.0.0-$(git rev-parse --short HEAD)"
          }
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          Write-Host "Build version: $VERSION"
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: cauc-sep/backend/requirements*.txt
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cauc-sep/frontend/package-lock.json
      
      - name: Install Python dependencies
        working-directory: cauc-sep/backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard ccache
          Write-Host "Python dependencies installed" -ForegroundColor Green
      
      - name: Setup Nuitka cache
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Nuitka\Nuitka\Cache
            ~\AppData\Local\ccache
            cauc-sep\backend\build
            cauc-sep\backend\.build
          key: nuitka-${{ runner.os }}-${{ hashFiles('cauc-sep/backend/requirements.txt', 'cauc-sep/backend/nuitka-config.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-
      
      - name: Install Zig compiler
        shell: pwsh
        run: |
          $zigVersion = "${{ env.ZIG_VERSION }}"
          $zigUrl = "https://ziglang.org/download/$zigVersion/zig-windows-x86_64-$zigVersion.zip"
          $zigZip = "$env:TEMP\zig.zip"
          $zigDir = "C:\zig"
          
          try {
            Write-Host "Downloading Zig $zigVersion..." -ForegroundColor Cyan
            Invoke-WebRequest -Uri $zigUrl -OutFile $zigZip -UseBasicParsing -TimeoutSec 120
            
            if (Test-Path $zigDir) { Remove-Item $zigDir -Recurse -Force }
            Expand-Archive -Path $zigZip -DestinationPath "C:\" -Force
            
            $extractedDir = "C:\zig-windows-x86_64-$zigVersion"
            if (Test-Path $extractedDir) {
              Rename-Item -Path $extractedDir -NewName "zig" -Force -ErrorAction SilentlyContinue
            }
            
            if (Test-Path "$zigDir\zig.exe") {
              Write-Host "Zig installed successfully: $zigDir" -ForegroundColor Green
              echo "$zigDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              & "$zigDir\zig.exe" version
            } else {
              Write-Host "WARNING: Zig installation incomplete" -ForegroundColor Yellow
            }
          } catch {
            Write-Host "Zig installation failed: $_" -ForegroundColor Yellow
            Write-Host "Continuing without Zig optimization" -ForegroundColor Yellow
          }
      
      - name: Build frontend
        working-directory: cauc-sep/frontend
        shell: pwsh
        run: |
          npm ci --prefer-offline --no-audit
          npm run build
          Write-Host "Frontend built successfully" -ForegroundColor Green
      
      - name: Verify frontend build
        working-directory: cauc-sep/frontend
        shell: pwsh
        run: |
          if (-not (Test-Path "dist")) {
            Write-Host "ERROR: Frontend dist not found!" -ForegroundColor Red
            exit 1
          }
          $fileCount = (Get-ChildItem -Path "dist" -Recurse -File).Count
          Write-Host "Frontend dist verified: $fileCount files" -ForegroundColor Green
      
      - name: Copy frontend to backend
        working-directory: cauc-sep
        shell: pwsh
        run: |
          $backendFrontend = "backend\frontend\dist"
          if (-not (Test-Path $backendFrontend)) {
            New-Item -ItemType Directory -Force -Path $backendFrontend | Out-Null
          }
          Copy-Item -Path "frontend\dist\*" -Destination $backendFrontend -Recurse -Force
          Write-Host "Frontend copied to backend directory" -ForegroundColor Green
      
      - name: Build backend with Nuitka
        id: nuitka-build
        working-directory: cauc-sep/backend
        shell: pwsh
        run: |
          Write-Host "Starting Nuitka build..." -ForegroundColor Cyan
          Write-Host "Python: $(python --version)" -ForegroundColor Gray
          Write-Host "Nuitka: $(python -m nuitka --version)" -ForegroundColor Gray
          
          python build_nuitka.py
          
          if ($LASTEXITCODE -ne 0) {
            throw "Nuitka build failed with exit code $LASTEXITCODE"
          }
          Write-Host "Nuitka build completed successfully" -ForegroundColor Green
      
      - name: Verify build output
        working-directory: cauc-sep/backend
        shell: pwsh
        run: |
          $exePath = "dist\CAUC-SEP-Backend.exe"
          if (-not (Test-Path $exePath)) {
            Write-Host "ERROR: Executable not found at $exePath!" -ForegroundColor Red
            Get-ChildItem -Path "dist" -Recurse | Format-Table Name, Length
            exit 1
          }
          $fileInfo = Get-Item $exePath
          $sizeMB = [math]::Round($fileInfo.Length / 1MB, 2)
          Write-Host "Build verified successfully!" -ForegroundColor Green
          Write-Host "Executable: $exePath" -ForegroundColor Cyan
          Write-Host "Size: $sizeMB MB" -ForegroundColor Cyan
      
      - name: Create release package
        working-directory: cauc-sep
        shell: pwsh
        run: |
          $version = "${{ steps.get-version.outputs.version }}"
          $releaseDir = "dist\CAUC-SEP-$version"
          
          Write-Host "Creating release package: $releaseDir" -ForegroundColor Cyan
          
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseDir\frontend" | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseDir\logs" | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseDir\data" | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseDir\config" | Out-Null
          
          Copy-Item "backend\dist\CAUC-SEP-Backend.exe" -Destination $releaseDir -Force
          Copy-Item "frontend\dist\*" -Destination "$releaseDir\frontend" -Recurse -Force
          
          $startBat = @'
@echo off
chcp 65001 >nul
title CAUC-SEP
echo ========================================
echo   CAUC-SEP 自旋电子实验平台
echo   Version: {VERSION}
echo ========================================
echo.
echo Starting backend service...
start "" CAUC-SEP-Backend.exe
timeout /t 3 /nobreak >nul
echo Opening web interface...
start http://localhost:8000
echo.
echo Service started. Press any key to stop...
pause >nul
taskkill /f /im CAUC-SEP-Backend.exe >nul 2>&1
'@ -replace '\{VERSION\}', $version
          $startBat | Out-File -FilePath "$releaseDir\start.bat" -Encoding ASCII
          
          $stopBat = @'
@echo off
echo Stopping CAUC-SEP service...
taskkill /f /im CAUC-SEP-Backend.exe >nul 2>&1
echo Service stopped.
pause
'@
          $stopBat | Out-File -FilePath "$releaseDir\stop.bat" -Encoding ASCII
          
          $readmeContent = @'
# CAUC-SEP 自旋电子实验平台

## 使用说明

1. 双击 `start.bat` 启动服务
2. 浏览器将自动打开 http://localhost:8000
3. 双击 `stop.bat` 停止服务

## 目录结构

- `CAUC-SEP-Backend.exe` - 后端服务程序
- `frontend/` - 前端静态文件
- `logs/` - 日志文件目录
- `data/` - 数据存储目录
- `config/` - 配置文件目录

## 注意事项

- 首次运行可能需要允许防火墙访问
- 如遇杀毒软件误报，请添加白名单
- 默认端口: 8000
'@
          $readmeContent | Out-File -FilePath "$releaseDir\README.txt" -Encoding UTF8
          
          Write-Host "Release package created" -ForegroundColor Green
      
      - name: Create ZIP archive
        working-directory: cauc-sep/dist
        shell: pwsh
        run: |
          $version = "${{ steps.get-version.outputs.version }}"
          $zipPath = "CAUC-SEP-$version.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "CAUC-SEP-$version" -DestinationPath $zipPath -Force
          $zipSize = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "Created: $zipPath ($zipSize MB)" -ForegroundColor Green
      
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAUC-SEP-Windows-ZIP
          path: cauc-sep/dist/CAUC-SEP-*.zip
          retention-days: 90
      
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAUC-SEP-Windows-EXE
          path: cauc-sep/backend/dist/CAUC-SEP-Backend.exe
          retention-days: 90
      
      - name: Set build status
        id: build-status
        shell: pwsh
        run: |
          echo "status=success" >> $env:GITHUB_OUTPUT
      
      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          $version = "${{ steps.get-version.outputs.version }}"
          $status = "${{ job.status }}"
          echo "## Windows Build Complete (Nuitka)" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "**Version**: $version" >> $env:GITHUB_STEP_SUMMARY
          echo "**Status**: $status" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $env:GITHUB_STEP_SUMMARY
          echo "- CAUC-SEP-$version.zip" >> $env:GITHUB_STEP_SUMMARY
          echo "- CAUC-SEP-Backend.exe" >> $env:GITHUB_STEP_SUMMARY

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-docker, build-windows-exe]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      (needs.build-docker.result == 'success' || needs.build-docker.result == 'skipped')
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"
      
      - name: Check Windows build status
        id: check-build-windows
        run: |
          if [ "${{ needs.build-windows-exe.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
      
      - name: Download ZIP artifact
        if: steps.check-build-windows.outputs.status == 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: CAUC-SEP-Windows-ZIP
          path: ./artifacts
      
      - name: Download EXE artifact
        if: steps.check-build-windows.outputs.status == 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: CAUC-SEP-Windows-EXE
          path: ./artifacts
      
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          cat > CHANGELOG.md << 'EOF'
          ## 🎉 Release ${{ steps.version.outputs.version }}
          
          ### 📦 Downloads
          
          | File | Description |
          |------|-------------|
          | CAUC-SEP-${{ steps.version.outputs.version }}.zip | Complete package with frontend |
          | CAUC-SEP-Backend.exe | Standalone executable |
          
          ### 🐳 Docker Images
          
          ```bash
          docker pull ghcr.io/${{ github.repository }}-backend:${{ steps.version.outputs.version }}
          docker pull ghcr.io/${{ github.repository }}-frontend:${{ steps.version.outputs.version }}
          ```
          
          ### 📝 Changes
          
          EOF
          
          if [ -n "$PREV_TAG" ]; then
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
          else
            echo "- Initial release" >> CHANGELOG.md
          fi
          
          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### ⚠️ Notes" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "- Windows Defender may flag the executable as suspicious (false positive)" >> CHANGELOG.md
          echo "- Add the executable to your antivirus whitelist if needed" >> CHANGELOG.md
          echo "- Default port: 8000" >> CHANGELOG.md
      
      - name: Prepare release files
        id: prepare-files
        run: |
          FILES=""
          ZIP_FILE=$(find artifacts -name "CAUC-SEP-*.zip" -type f 2>/dev/null | head -1)
          if [ -n "$ZIP_FILE" ]; then
            FILES="$FILES $ZIP_FILE"
          fi
          if [ -f "artifacts/CAUC-SEP-Backend.exe" ]; then
            FILES="$FILES artifacts/CAUC-SEP-Backend.exe"
          fi
          echo "files=$FILES" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
          files: ${{ steps.prepare-files.outputs.files }}
      
      - name: Release summary
        if: always()
        run: |
          echo "## Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
