# ============================================================================
# CAUC-SEP CI/CD Pipeline - Main Workflow
# ============================================================================
#
# 文件名: ci.yml
# 路径: .github/workflows/ci.yml
# 功能: 持续集成流水线 - 代码检查、测试、构建
# 版本: v1.0.0
# 创建日期: 2026-03-25
# 作者: DevOps Engineer Agent
#
# 触发条件:
#   - push: main, develop 分支
#   - pull_request: main 分支
#
# 流水线阶段:
#   1. 代码质量检查 (Lint)
#   2. 后端测试 (Test Backend)
#   3. 前端测试 (Test Frontend)
#   4. E2E测试 (E2E Tests)
#   5. 构建产物 (Build)
#
# 安全约束:
#   - 所有敏感信息通过 GitHub Secrets 配置
#   - 测试覆盖率阈值: 80%
#   - 代码质量检查必须通过
# ============================================================================

name: CAUC-SEP CI Pipeline

on:
  push:
    branches: [ main, develop, 'release/**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

# 并发控制：同一分支只运行一个实例
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '20'
  APP_VERSION: '4.0.0'

jobs:
  # ==================== 代码质量检查 ====================
  lint:
    name: 代码质量检查
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install black isort ruff mypy
          pip install -r requirements.txt

      - name: Black 格式检查
        working-directory: backend
        run: black --check --line-length 100 .

      - name: isort 导入排序检查
        working-directory: backend
        run: isort --check-only --profile black .

      - name: Ruff 代码检查
        working-directory: backend
        run: ruff check .

      - name: MyPy 类型检查
        working-directory: backend
        run: mypy --strict .
        continue-on-error: true

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: ESLint 检查
        working-directory: frontend
        run: npm run lint

      - name: TypeScript 类型检查
        working-directory: frontend
        run: npm run typecheck

  # ==================== 后端测试 ====================
  test-backend:
    name: 后端测试
    runs-on: windows-latest
    needs: lint
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: 运行单元测试
        working-directory: backend
        env:
          APP_ENV: testing
          MOTOR_SIMULATION: true
          ELECTROMAGNET_SIMULATION: true
          TEMPERATURE_SIMULATION: true
          PIEZO_SIMULATION: true
          AMMETER_SIMULATION: true
        run: |
          pytest tests/unit -v --cov=. --cov-report=xml --cov-report=html --cov-fail-under=80

      - name: 运行集成测试
        working-directory: backend
        env:
          APP_ENV: testing
          MOTOR_SIMULATION: true
        run: |
          pytest tests/integration -v -m "not hardware" --cov=. --cov-report=xml --cov-append

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: |
            backend/htmlcov/
            backend/coverage.xml
          retention-days: 7

  # ==================== 前端测试 ====================
  test-frontend:
    name: 前端测试
    runs-on: windows-latest
    needs: lint
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 运行单元测试
        working-directory: frontend
        run: npm run test:coverage

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-report
          path: frontend/coverage/
          retention-days: 7

  # ==================== E2E 测试 ====================
  test-e2e:
    name: E2E 测试
    runs-on: windows-latest
    needs: [test-backend, test-frontend]
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 启动后端服务
        working-directory: backend
        env:
          APP_ENV: testing
          MOTOR_SIMULATION: true
          ELECTROMAGNET_SIMULATION: true
          TEMPERATURE_SIMULATION: true
          PIEZO_SIMULATION: true
          AMMETER_SIMULATION: true
        run: |
          Start-Process python -ArgumentList "main.py" -NoNewWindow
          Start-Sleep -Seconds 10

      - name: 运行 E2E 测试
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: true

      - name: 上传 E2E 测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-report
          path: frontend/playwright-report/
          retention-days: 7

  # ==================== 构建产物 ====================
  build:
    name: 构建产物
    runs-on: windows-latest
    needs: [test-backend, test-frontend]
    timeout-minutes: 60
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

      - name: 生成版本信息
        id: version
        run: |
          $version = "${{ env.APP_VERSION }}"
          $commitHash = "${{ github.sha }}".Substring(0, 7)
          $buildNumber = "${{ github.run_number }}"
          $fullVersion = "$version+$buildNumber.$commitHash"
          Write-Output "version=$fullVersion" >> $env:GITHUB_OUTPUT
          Write-Output "Full version: $fullVersion"

      - name: 创建构建信息文件
        run: |
          $buildInfo = @{
            version = "${{ steps.version.outputs.version }}"
            commit = "${{ github.sha }}"
            branch = "${{ github.ref_name }}"
            buildNumber = "${{ github.run_number }}"
            buildTime = (Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          }
          $buildInfo | ConvertTo-Json | Out-File -FilePath "build-info.json" -Encoding utf8

      - name: 上传构建信息
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.json
          retention-days: 7

  # ==================== 发布检查 ====================
  release-check:
    name: 发布检查
    runs-on: windows-latest
    needs: [lint, test-backend, test-frontend, test-e2e, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 验证版本号
        run: |
          $branch = "${{ github.ref_name }}"
          $version = $branch -replace "release/", ""
          Write-Output "Release version: $version"
          
          # 验证版本号格式
          if ($version -notmatch "^\d+\.\d+\.\d+$") {
            Write-Error "Invalid version format: $version"
            exit 1
          }

      - name: 验证 CHANGELOG
        run: |
          $version = "${{ github.ref_name }}" -replace "release/", ""
          $changelog = Get-Content "CHANGELOG.md" -Raw
          if ($changelog -notmatch "\[?$version\]?") {
            Write-Warning "CHANGELOG.md may not contain version $version"
          }

      - name: 发布就绪确认
        run: |
          Write-Output "=========================================="
          Write-Output "  发布检查通过"
          Write-Output "  版本: ${{ github.ref_name }}"
          Write-Output "  提交: ${{ github.sha }}"
          Write-Output "=========================================="
