# =============================================================================
# CD Continuous Deployment Configuration File
# =============================================================================
# 
# Filename: cd.yml
# Path: .github/workflows/cd.yml
# Function: Continuous deployment workflow, image build and version release
# Version: v0.3.0
#
# Features:
# - Docker image build and push: Backend, frontend images to GHCR
# - Windows executable build: Compile to standalone EXE with Nuitka
# - GitHub Release: Auto-create version release page
# - Artifact archive: ZIP package, standalone EXE file
#
# Triggers:
# - push to main branch
# - Create version tag (v*)
# - Manual trigger (workflow_dispatch)
#
# Deployment Environments:
# - staging: Staging environment
# - production: Production environment
#
# Tech Stack:
# - Containerization: Docker + GitHub Container Registry
# - Compiler: Nuitka + Zig C compiler
# - Runtime: Python 3.11 + Node.js 20
#
# Author: CAUC-SEP Development Team
# Created: 2024-03-14
# Last Updated: 2026-03-14
# =============================================================================

name: CD

# Trigger Configuration
on:
  push:
    branches:
      - main  # Main branch: Production environment deployment
    tags:
      - 'v*'  # Version tag: Trigger formal release
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging      # Staging environment
          - production   # Production environment
      version:
        description: 'Deployment version (leave empty for latest commit)'
        required: false
        type: string
      rollback:
        description: 'Rollback operation'
        required: false
        default: false
        type: boolean
      build_windows:
        description: 'Build Windows executable'
        required: false
        default: true
        type: boolean

# Global Environment Variables
env:
  PYTHON_VERSION: '3.11'    # Python version
  NODE_VERSION: '20'        # Node.js version
  REGISTRY: ghcr.io         # Docker registry
  IMAGE_NAME: ${{ github.repository }}
  ZIG_VERSION: '0.13.0'     # Zig C compiler version (for Nuitka optimization)

# Concurrency Control: Only keep the latest deployment for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Job Definitions
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  # Build and Push Docker Images
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: read      # Read repository content
      packages: write     # Push images to GitHub Packages

    outputs:
      backend_tag: ${{ steps.meta-backend.outputs.tags }}
      frontend_tag: ${{ steps.meta-frontend.outputs.tags }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Complete history for version number generation

      # Get version number
      # Priority: Manual input > Git tag > Git describe > Default version
      - name: Get Version Number
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "v0.0.0-$(git rev-parse --short HEAD)")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Build version: $VERSION"

      # Configure Docker Buildx (supports multi-platform builds and caching)
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend image metadata
      # Generate tags: branch name, PR number, semantic version, SHA, custom version
      - name: Backend Image Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}

      # Build and push backend image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./cauc-sep/backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha  # Use GitHub Actions cache
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      # Frontend image metadata
      - name: Frontend Image Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}

      # Build and push frontend image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./cauc-sep/frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      # Output build info
      - name: Output Build Info
        run: |
          echo "## 🐳 Docker Image Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Image**:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-backend.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Image**:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-frontend.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Build Windows Executable (Nuitka)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: build-and-push
    timeout-minutes: 240  # 4-hour timeout (Nuitka compilation takes longer)
    
    # Condition: Tag release or manual trigger with Windows build enabled
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_windows == 'true'))
    
    permissions:
      contents: write  # Create Release requires

    outputs:
      version: ${{ steps.get-version.outputs.version }}
      build_status: ${{ steps.build-status.outputs.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Get version number
      - name: Get Version Number
        id: get-version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $VERSION = "${{ github.event.inputs.version }}"
          } elseif ($env:GITHUB_REF -match '^refs/tags/v') {
            $VERSION = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $VERSION = "v0.0.0-$(git rev-parse --short HEAD)"
          }
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          Write-Host "📦 Build version: $VERSION" -ForegroundColor Cyan

      # Setup Python environment
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: cauc-sep/backend/requirements*.txt

      # Setup Node.js environment
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cauc-sep/frontend/package-lock.json

      # Install Python dependencies
      - name: Install Python Dependencies
        working-directory: cauc-sep/backend
        shell: pwsh
        run: |
          Write-Host "=== Python Environment Info ===" -ForegroundColor Cyan
          python --version
          pip --version
          
          Write-Host "`n=== Upgrade pip ===" -ForegroundColor Cyan
          python -m pip install --upgrade pip setuptools wheel
          
          Write-Host "`n=== Install Dependencies ===" -ForegroundColor Cyan
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard ccache
          
          Write-Host "`n=== Verify Installation ===" -ForegroundColor Cyan
          pip list | Select-String -Pattern "nuitka|numpy|scipy|fastapi"

      # Configure Nuitka cache (speed up subsequent builds)
      - name: Configure Nuitka Cache
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Nuitka\Nuitka\Cache
            ~\AppData\Local\ccache
            cauc-sep\backend\build
            cauc-sep\backend\.build
          key: nuitka-${{ runner.os }}-${{ hashFiles('cauc-sep/backend/requirements.txt', 'cauc-sep/backend/nuitka-config.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      # Install Zig C compiler (Nuitka optimization)
      - name: Install Zig Compiler
        shell: pwsh
        run: |
          $zigVersion = "${{ env.ZIG_VERSION }}"
          $zigUrl = "https://ziglang.org/download/$zigVersion/zig-windows-x86_64-$zigVersion.zip"
          $zigZip = "$env:TEMP\zig.zip"
          $zigDir = "C:\zig"
          
          try {
            Write-Host "Downloading Zig $zigVersion..." -ForegroundColor Cyan
            Invoke-WebRequest -Uri $zigUrl -OutFile $zigZip -UseBasicParsing -TimeoutSec 120
            
            if (Test-Path $zigDir) { Remove-Item $zigDir -Recurse -Force }
            Expand-Archive -Path $zigZip -DestinationPath "C:\" -Force
            
            $extractedDir = "C:\zig-windows-x86_64-$zigVersion"
            if (Test-Path $extractedDir) {
              Rename-Item -Path $extractedDir -NewName "zig" -Force -ErrorAction SilentlyContinue
            }
            
            if (Test-Path "$zigDir\zig.exe") {
              Write-Host "✅ Zig installed successfully: $zigDir" -ForegroundColor Green
              echo "$zigDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              & "$zigDir\zig.exe" version
            } else {
              Write-Host "⚠️ Zig installation incomplete" -ForegroundColor Yellow
            }
          } catch {
            Write-Host "⚠️ Zig installation failed: $_" -ForegroundColor Yellow
            Write-Host "Continuing without Zig optimization" -ForegroundColor Yellow
          }

      # Build frontend
      - name: Build Frontend
        working-directory: cauc-sep/frontend
        shell: pwsh
        run: |
          npm ci --prefer-offline --no-audit
          npm run build
          Write-Host "✅ Frontend build complete" -ForegroundColor Green

      # Verify frontend build
      - name: Verify Frontend Build
        working-directory: cauc-sep/frontend
        shell: pwsh
        run: |
          if (-not (Test-Path "dist")) {
            Write-Host "❌ Frontend dist directory not found!" -ForegroundColor Red
            exit 1
          }
          $fileCount = (Get-ChildItem -Path "dist" -Recurse -File).Count
          Write-Host "✅ Frontend dist verification passed: $fileCount files" -ForegroundColor Green

      # Copy frontend to backend directory
      - name: Copy Frontend to Backend
        working-directory: cauc-sep
        shell: pwsh
        run: |
          $backendFrontend = "backend\frontend\dist"
          if (-not (Test-Path $backendFrontend)) {
            New-Item -ItemType Directory -Force -Path $backendFrontend | Out-Null
          }
          Copy-Item -Path "frontend\dist\*" -Destination $backendFrontend -Recurse -Force
          Write-Host "✅ Frontend copied to backend directory" -ForegroundColor Green

      # Build backend with Nuitka
      - name: Nuitka Compile Backend
        id: nuitka-build
        working-directory: cauc-sep/backend
        shell: pwsh
        run: |
          Write-Host "Starting Nuitka compilation..." -ForegroundColor Cyan
          Write-Host "Python: $(python --version)" -ForegroundColor Gray
          Write-Host "Nuitka: $(python -m nuitka --version)" -ForegroundColor Gray
          
          python build_nuitka.py
          
          if ($LASTEXITCODE -ne 0) {
            throw "Nuitka compilation failed, exit code: $LASTEXITCODE"
          }
          Write-Host "✅ Nuitka compilation complete" -ForegroundColor Green

      # Verify build output
      - name: Verify Build Output
        working-directory: cauc-sep/backend
        shell: pwsh
        run: |
          $exePath = "dist\CAUC-SEP-Backend.exe"
          if (-not (Test-Path $exePath)) {
            Write-Host "❌ Executable not found: $exePath" -ForegroundColor Red
            Get-ChildItem -Path "dist" -Recurse | Format-Table Name, Length
            exit 1
          }
          $fileInfo = Get-Item $exePath
          $sizeMB = [math]::Round($fileInfo.Length / 1MB, 2)
          Write-Host "✅ Build verification passed" -ForegroundColor Green
          Write-Host "Executable: $exePath" -ForegroundColor Cyan
          Write-Host "File size: $sizeMB MB" -ForegroundColor Cyan

      # Create release package
      - name: Create Release Package
        working-directory: cauc-sep
        shell: pwsh
        run: |
          $version = "${{ steps.get-version.outputs.version }}"
          $releaseDir = "dist\CAUC-SEP-$version"
          
          Write-Host "Creating release package: $releaseDir" -ForegroundColor Cyan
          
          # Create directory structure
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseDir\frontend" | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseDir\logs" | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseDir\data" | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseDir\config" | Out-Null
          
          # Copy files
          Copy-Item "backend\dist\CAUC-SEP-Backend.exe" -Destination $releaseDir -Force
          Copy-Item "frontend\dist\*" -Destination "$releaseDir\frontend" -Recurse -Force
          
          # Create startup script
          $startBat = @'
          @echo off
          chcp 65001 >nul
          title CAUC-SEP
          echo ========================================
          echo   CAUC-SEP Spintronics Experiment Platform
          echo   Version: {VERSION}
          echo ========================================
          echo.
          echo Starting backend service...
          start "" CAUC-SEP-Backend.exe
          timeout /t 3 /nobreak >nul
          echo Opening web interface...
          start http://localhost:8000
          echo.
          echo Service started, press any key to stop...
          pause >nul
          taskkill /f /im CAUC-SEP-Backend.exe >nul 2>&1
          '@ -replace '\{VERSION\}', $version
          $startBat | Out-File -FilePath "$releaseDir\start.bat" -Encoding ASCII
          
          # Create stop script
          $stopBat = @'
          @echo off
          echo Stopping CAUC-SEP service...
          taskkill /f /im CAUC-SEP-Backend.exe >nul 2>&1
          echo Service stopped.
          pause
          '@
          $stopBat | Out-File -FilePath "$releaseDir\stop.bat" -Encoding ASCII
          
          # Create README
          $readmeContent = @'
          # CAUC-SEP Spintronics Experiment Platform

          ## Usage

          1. Double-click `start.bat` to start the service
          2. Browser will automatically open http://localhost:8000
          3. Double-click `stop.bat` to stop the service

          ## Directory Structure

          - `CAUC-SEP-Backend.exe` - Backend service program
          - `frontend/` - Frontend static files
          - `logs/` - Log file directory
          - `data/` - Data storage directory
          - `config/` - Configuration file directory

          ## Notes

          - First run may require firewall access
          - If antivirus flags as suspicious, add to whitelist
          - Default port: 8000
          '@
          $readmeContent | Out-File -FilePath "$releaseDir\README.txt" -Encoding UTF8
          
          Write-Host "✅ Release package created" -ForegroundColor Green

      # Create ZIP archive
      - name: Create ZIP Archive
        working-directory: cauc-sep/dist
        shell: pwsh
        run: |
          $version = "${{ steps.get-version.outputs.version }}"
          $zipPath = "CAUC-SEP-$version.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "CAUC-SEP-$version" -DestinationPath $zipPath -Force
          $zipSize = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "✅ Created ZIP: $zipPath ($zipSize MB)" -ForegroundColor Green

      # Upload ZIP artifact
      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAUC-SEP-Windows-ZIP
          path: cauc-sep/dist/CAUC-SEP-*.zip
          retention-days: 90  # Keep for 90 days

      # Upload EXE artifact
      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAUC-SEP-Windows-EXE
          path: cauc-sep/backend/dist/CAUC-SEP-Backend.exe
          retention-days: 90

      # Set build status
      - name: Set Build Status
        id: build-status
        shell: pwsh
        run: |
          echo "status=success" >> $env:GITHUB_OUTPUT

      # Build summary
      - name: Build Summary
        if: always()
        shell: pwsh
        run: |
          $version = "${{ steps.get-version.outputs.version }}"
          $status = "${{ job.status }}"
          echo "## 🪟 Windows Build Complete (Nuitka)" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "**Version**: $version" >> $env:GITHUB_STEP_SUMMARY
          echo "**Status**: $status" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $env:GITHUB_STEP_SUMMARY
          echo "- CAUC-SEP-$version.zip" >> $env:GITHUB_STEP_SUMMARY
          echo "- CAUC-SEP-Backend.exe" >> $env:GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Create GitHub Release
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, build-windows]
    
    # Condition: Tag release and Docker build success or skipped
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    
    timeout-minutes: 15
    permissions:
      contents: write  # Create Release requires

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Get version number
      - name: Get Version Number
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Release version: $VERSION"

      # Check Windows build status
      - name: Check Windows Build Status
        id: check-build-windows
        run: |
          if [ "${{ needs.build-windows.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      # Download ZIP artifact
      - name: Download ZIP Artifact
        if: steps.check-build-windows.outputs.status == 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: CAUC-SEP-Windows-ZIP
          path: ./artifacts

      # Download EXE artifact
      - name: Download EXE Artifact
        if: steps.check-build-windows.outputs.status == 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: CAUC-SEP-Windows-EXE
          path: ./artifacts

      # Generate changelog
      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          cat > CHANGELOG.md << 'EOF'
          ## 🎉 Release ${{ steps.version.outputs.version }}
          
          ### 📦 Downloads
          
          | File | Description |
          |------|-------------|
          | CAUC-SEP-${{ steps.version.outputs.version }}.zip | Full release package (with frontend) |
          | CAUC-SEP-Backend.exe | Standalone executable |
          
          ### 🐳 Docker Images
          
          ```bash
          # Pull backend image
          docker pull ghcr.io/${{ github.repository }}-backend:${{ steps.version.outputs.version }}
          
          # Pull frontend image
          docker pull ghcr.io/${{ github.repository }}-frontend:${{ steps.version.outputs.version }}
          ```
          
          ### 📝 Changes
          
          EOF
          
          if [ -n "$PREV_TAG" ]; then
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
          else
            echo "- Initial release" >> CHANGELOG.md
          fi
          
          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### ⚠️ Notes" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "- Windows Defender may flag executable as suspicious (false positive)" >> CHANGELOG.md
          echo "- If antivirus blocks, add program to whitelist" >> CHANGELOG.md
          echo "- Default port: 8000" >> CHANGELOG.md

      # Prepare release files
      - name: Prepare Release Files
        id: prepare-files
        run: |
          FILES=""
          ZIP_FILE=$(find artifacts -name "CAUC-SEP-*.zip" -type f 2>/dev/null | head -1)
          if [ -n "$ZIP_FILE" ]; then
            FILES="$FILES $ZIP_FILE"
          fi
          if [ -f "artifacts/CAUC-SEP-Backend.exe" ]; then
            FILES="$FILES artifacts/CAUC-SEP-Backend.exe"
          fi
          echo "files=$FILES" >> $GITHUB_OUTPUT

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
          files: ${{ steps.prepare-files.outputs.files }}

      # Release summary
      - name: Release Summary
        if: always()
        run: |
          echo "## 🚀 Release Created" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
