name: CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Deploy version (leave empty for latest commit)'
        required: false
        type: string
      rollback:
        description: 'Rollback operation'
        required: false
        default: false
        type: boolean
      build_windows:
        description: 'Build Windows executable'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      backend_tag: ${{ steps.meta-backend.outputs.tags }}
      frontend_tag: ${{ steps.meta-frontend.outputs.tags }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "v0.0.0-$(git rev-parse --short HEAD)")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./cauc-sep/backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          no-cache: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./cauc-sep/frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          no-cache: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Output image info
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Image**:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-backend.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Image**:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-frontend.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  build-windows:
    name: Build Windows Executable (Nuitka)
    runs-on: windows-latest
    needs: build-and-push
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_windows == 'true')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cauc-sep/frontend/package-lock.json

      - name: Install Python dependencies
        working-directory: cauc-sep/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Setup Nuitka cache
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Nuitka\Nuitka\Cache
            cauc-sep\backend\build
            cauc-sep\backend\dist
          key: nuitka-${{ runner.os }}-${{ hashFiles('cauc-sep/backend/requirements.txt', 'cauc-sep/backend/nuitka-config.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Install Zig compiler
        run: |
          Write-Host "Installing Zig compiler for Nuitka optimization..." -ForegroundColor Cyan
          $zigVersion = "0.11.0"
          $zigUrl = "https://ziglang.org/download/$zigVersion/zig-windows-x86_64-$zigVersion.zip"
          $zigZip = "$env:TEMP\zig.zip"
          $zigDir = "C:\zig"
          
          Invoke-WebRequest -Uri $zigUrl -OutFile $zigZip -UseBasicParsing
          Expand-Archive -Path $zigZip -DestinationPath "C:\" -Force
          Rename-Item -Path "C:\zig-windows-x86_64-$zigVersion" -NewName "zig" -Force -ErrorAction SilentlyContinue
          
          $zigPath = "C:\zig"
          if (Test-Path "$zigPath\zig.exe") {
            Write-Host "Zig installed successfully at $zigPath" -ForegroundColor Green
            Write-Host "Zig version: $(& "$zigPath\zig.exe" version)" -ForegroundColor Green
            echo "$zigPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host "Warning: Zig installation may have failed, continuing without Zig optimization" -ForegroundColor Yellow
          }

      - name: Build frontend
        working-directory: cauc-sep/frontend
        run: |
          npm ci
          npm run build

      - name: Verify build environment
        working-directory: cauc-sep/backend
        run: |
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "  Build Environment Verification" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host ""
          
          Write-Host "Python version:" -ForegroundColor Yellow
          python --version
          
          Write-Host "`nNuitka version:" -ForegroundColor Yellow
          python -m nuitka --version
          
          Write-Host "`nZig compiler:" -ForegroundColor Yellow
          $zigPath = Get-Command zig -ErrorAction SilentlyContinue
          if ($zigPath) {
            Write-Host "Zig found at: $($zigPath.Source)" -ForegroundColor Green
            zig version
          } else {
            Write-Host "Zig not found in PATH, checking C:\zig..." -ForegroundColor Yellow
            if (Test-Path "C:\zig\zig.exe") {
              Write-Host "Zig found at C:\zig\zig.exe" -ForegroundColor Green
              & "C:\zig\zig.exe" version
              $env:PATH = "C:\zig;$env:PATH"
              echo "C:\zig" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              Write-Host "Warning: Zig not found, compilation will proceed without Zig optimization" -ForegroundColor Red
            }
          }
          
          Write-Host "`nVisual Studio Build Tools:" -ForegroundColor Yellow
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsWhere) {
            & $vsWhere -latest -property displayName
          } else {
            Write-Host "vswhere not found" -ForegroundColor Yellow
          }
          
          Write-Host "`n========================================" -ForegroundColor Cyan

      - name: Build backend with Nuitka
        id: nuitka-build
        working-directory: cauc-sep/backend
        run: python build_nuitka.py

      - name: Verify build output
        working-directory: cauc-sep/backend
        run: |
          $exePath = "dist\CAUC-SEP-Backend.exe"
          if (-not (Test-Path $exePath)) {
            Write-Host "ERROR: Executable not found at $exePath" -ForegroundColor Red
            Write-Host ""
            Write-Host "Listing dist directory contents:" -ForegroundColor Yellow
            if (Test-Path "dist") {
              Get-ChildItem -Path "dist" -Recurse | Format-Table Name, Length, LastWriteTime
            } else {
              Write-Host "dist directory does not exist!" -ForegroundColor Red
            }
            exit 1
          }
          
          Write-Host "Build verification passed!" -ForegroundColor Green
          $fileInfo = Get-Item $exePath
          Write-Host "File size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
          Write-Host "Created: $($fileInfo.CreationTime)"

      - name: Create release package
        working-directory: cauc-sep
        run: |
          $releaseDir = "dist\CAUC-SEP"
          New-Item -ItemType Directory -Force -Path $releaseDir
          New-Item -ItemType Directory -Force -Path "$releaseDir\frontend"
          New-Item -ItemType Directory -Force -Path "$releaseDir\logs"
          New-Item -ItemType Directory -Force -Path "$releaseDir\data"
          
          Copy-Item "backend\dist\CAUC-SEP-Backend.exe" -Destination $releaseDir
          Copy-Item "frontend\dist\*" -Destination "$releaseDir\frontend" -Recurse
          
          $startBat = @"
          @echo off
          chcp 65001 >nul
          echo ==========================================
          echo   CAUC-SEP 自旋电子实验平台
          echo ==========================================
          echo.
          echo 正在启动服务...
          start "" CAUC-SEP-Backend.exe
          timeout /t 3 /nobreak >nul
          start http://localhost:8000
          echo 服务已启动，请勿关闭此窗口。
          echo 按任意键停止服务...
          pause >nul
          taskkill /f /im CAUC-SEP-Backend.exe >nul 2>&1
          "@
          $startBat | Out-File -FilePath "$releaseDir\start.bat" -Encoding ASCII
          
          $stopBat = @"
          @echo off
          echo 正在停止 CAUC-SEP 服务...
          taskkill /f /im CAUC-SEP-Backend.exe >nul 2>&1
          echo 服务已停止。
          pause
          "@
          $stopBat | Out-File -FilePath "$releaseDir\stop.bat" -Encoding ASCII

      - name: Create ZIP archive
        working-directory: cauc-sep/dist
        run: |
          $version = "${{ needs.build-and-push.outputs.version }}"
          Compress-Archive -Path "CAUC-SEP" -DestinationPath "CAUC-SEP-$version.zip"
          
          Write-Host "Created: CAUC-SEP-$version.zip"
          $zipInfo = Get-Item "CAUC-SEP-$version.zip"
          Write-Host "ZIP size: $([math]::Round($zipInfo.Length / 1MB, 2)) MB"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAUC-SEP-Windows-ZIP
          path: cauc-sep/dist/CAUC-SEP-*.zip
          retention-days: 30

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAUC-SEP-Windows-EXE
          path: cauc-sep/backend/dist/CAUC-SEP-Backend.exe
          retention-days: 30

      - name: Build summary
        run: |
          echo "## Windows Build Complete (Nuitka)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.build-and-push.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Compiler**: Nuitka (LTO + Zig)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts**:" >> $GITHUB_STEP_SUMMARY
          echo "- CAUC-SEP-Windows-ZIP (完整压缩包)" >> $GITHUB_STEP_SUMMARY
          echo "- CAUC-SEP-Windows-EXE (独立可执行文件)" >> $GITHUB_STEP_SUMMARY

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.cauc-sep.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          echo "Deploy version: ${{ needs.build-and-push.outputs.version }}"
          echo "Deploy environment: staging"

      - name: Health check
        run: |
          echo "Running health check..."

      - name: Deploy notification
        if: always()
        run: |
          echo "## Staging Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.build-and-push.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://cauc-sep.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-deploy backup
        run: |
          echo "Creating pre-deploy backup..."

      - name: Deploy to Production
        run: |
          echo "Deploy version: ${{ needs.build-and-push.outputs.version }}"
          echo "Deploy environment: production"

      - name: Health check
        run: |
          echo "Running health check..."

      - name: Deploy notification
        if: always()
        run: |
          echo "## Production Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.build-and-push.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-production, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: CAUC-SEP-Windows-ZIP
          path: ./artifacts

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: CAUC-SEP-Windows-EXE
          path: ./artifacts

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
          else
            echo "## Initial Release" > CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Download Options" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "- **CAUC-SEP-{version}.zip**: 完整安装包（包含前端、启动脚本等）" >> CHANGELOG.md
          echo "- **CAUC-SEP-Backend.exe**: 独立可执行文件（仅后端服务）" >> CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
          files: |
            artifacts/CAUC-SEP-*.zip
            artifacts/CAUC-SEP-Backend.exe

      - name: Release notification
        run: |
          echo "## Release Created" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Assets**:" >> $GITHUB_STEP_SUMMARY
          ls -la artifacts/ >> $GITHUB_STEP_SUMMARY
