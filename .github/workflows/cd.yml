name: CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Deploy version (leave empty for latest commit)'
        required: false
        type: string
      rollback:
        description: 'Rollback operation'
        required: false
        default: false
        type: boolean
      build_windows:
        description: 'Build Windows executable'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      backend_tag: ${{ steps.meta-backend.outputs.tags }}
      frontend_tag: ${{ steps.meta-frontend.outputs.tags }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "v0.0.0-$(git rev-parse --short HEAD)")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./cauc-sep/backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./cauc-sep/frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Output image info
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Image**:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-backend.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Image**:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-frontend.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  build-windows:
    name: Build Windows Executable (Nuitka)
    runs-on: windows-latest
    needs: build-and-push
    timeout-minutes: 180
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_windows == 'true'))
    permissions:
      contents: write

    outputs:
      version: ${{ steps.get-version.outputs.version }}
      build_status: ${{ steps.build-status.outputs.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get-version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $VERSION = "${{ github.event.inputs.version }}"
          } elseif ($env:GITHUB_REF -match '^refs/tags/v') {
            $VERSION = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $VERSION = "v0.0.0-$(git rev-parse --short HEAD)"
          }
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "Build version: $VERSION"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cauc-sep/frontend/package-lock.json

      - name: Install Python dependencies
        working-directory: cauc-sep/backend
        shell: pwsh
        run: |
          Write-Host "=== Python Environment Info ===" -ForegroundColor Cyan
          python --version
          pip --version
          
          Write-Host "`n=== Upgrading pip ===" -ForegroundColor Cyan
          python -m pip install --upgrade pip setuptools wheel
          
          Write-Host "`n=== Installing all dependencies ===" -ForegroundColor Cyan
          pip install numpy scipy matplotlib h5py --prefer-binary
          pip install fastapi uvicorn[standard] pymodbus pyserial lmfit sqlalchemy pydantic
          pip install python-jose[cryptography] passlib[bcrypt] python-multipart
          pip install psutil msgpack aiofiles redis
          
          Write-Host "`n=== Installing Nuitka ===" -ForegroundColor Cyan
          pip install nuitka ordered-set zstandard
          
          Write-Host "`n=== Verifying installed packages ===" -ForegroundColor Cyan
          pip list

      - name: Setup Nuitka cache
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Nuitka\Nuitka\Cache
            ~\AppData\Local\ccache
            cauc-sep\backend\build
            cauc-sep\backend\dist
          key: nuitka-${{ runner.os }}-${{ hashFiles('cauc-sep/backend/requirements.txt', 'cauc-sep/backend/nuitka-config.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Install Zig compiler
        shell: pwsh
        run: |
          $zigVersion = "0.13.0"
          $zigUrl = "https://ziglang.org/download/$zigVersion/zig-windows-x86_64-$zigVersion.zip"
          $zigZip = "$env:TEMP\zig.zip"
          $zigDir = "C:\zig"
          
          try {
            Write-Host "Downloading Zig $zigVersion..." -ForegroundColor Cyan
            Invoke-WebRequest -Uri $zigUrl -OutFile $zigZip -UseBasicParsing
            Expand-Archive -Path $zigZip -DestinationPath "C:\" -Force
            Rename-Item -Path "C:\zig-windows-x86_64-$zigVersion" -NewName "zig" -Force -ErrorAction SilentlyContinue
            
            if (Test-Path "$zigDir\zig.exe") {
              Write-Host "Zig installed successfully at $zigDir" -ForegroundColor Green
              echo "$zigDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          } catch {
            Write-Host "Zig installation failed, continuing without Zig optimization" -ForegroundColor Yellow
            Write-Host "Error: $_" -ForegroundColor Red
          }

      - name: Build frontend
        working-directory: cauc-sep/frontend
        shell: pwsh
        run: |
          npm ci
          npm run build
          Write-Host "Frontend built successfully" -ForegroundColor Green

      - name: Verify frontend build
        working-directory: cauc-sep/frontend
        shell: pwsh
        run: |
          if (-not (Test-Path "dist")) {
            Write-Host "ERROR: Frontend dist directory not found!" -ForegroundColor Red
            exit 1
          }
          Write-Host "Frontend dist directory exists" -ForegroundColor Green

      - name: Build backend with Nuitka
        id: nuitka-build
        working-directory: cauc-sep/backend
        shell: pwsh
        run: |
          python build_nuitka.py
          if ($LASTEXITCODE -ne 0) {
            throw "Nuitka build failed with exit code $LASTEXITCODE"
          }
          Write-Host "Nuitka build completed successfully" -ForegroundColor Green

      - name: Verify build output
        working-directory: cauc-sep/backend
        shell: pwsh
        run: |
          $exePath = "dist\CAUC-SEP-Backend.exe"
          if (-not (Test-Path $exePath)) {
            Write-Host "ERROR: Executable not found at $exePath" -ForegroundColor Red
            exit 1
          }
          $fileInfo = Get-Item $exePath
          Write-Host "Build verification passed! Size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB" -ForegroundColor Green

      - name: Create release package
        working-directory: cauc-sep
        shell: pwsh
        run: |
          $releaseDir = "dist\CAUC-SEP"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseDir\frontend" | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseDir\logs" | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseDir\data" | Out-Null
          
          Copy-Item "backend\dist\CAUC-SEP-Backend.exe" -Destination $releaseDir -Force
          Copy-Item "frontend\dist\*" -Destination "$releaseDir\frontend" -Recurse -Force
          
          $startBatContent = "@echo off", "chcp 65001 >nul", "echo Starting CAUC-SEP...", "start `"`" CAUC-SEP-Backend.exe", "timeout /t 3 /nobreak >nul", "start http://localhost:8000", "pause"
          $startBatContent | Out-File -FilePath "$releaseDir\start.bat" -Encoding ASCII
          
          $stopBatContent = "@echo off", "echo Stopping CAUC-SEP...", "taskkill /f /im CAUC-SEP-Backend.exe >nul 2>&1", "echo Service stopped.", "pause"
          $stopBatContent | Out-File -FilePath "$releaseDir\stop.bat" -Encoding ASCII
          
          Write-Host "Release package created successfully" -ForegroundColor Green

      - name: Create ZIP archive
        working-directory: cauc-sep/dist
        shell: pwsh
        run: |
          $version = "${{ steps.get-version.outputs.version }}"
          $zipPath = "CAUC-SEP-$version.zip"
          Compress-Archive -Path "CAUC-SEP" -DestinationPath $zipPath -Force
          Write-Host "Created: $zipPath" -ForegroundColor Green

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAUC-SEP-Windows-ZIP
          path: cauc-sep/dist/CAUC-SEP-*.zip
          retention-days: 30

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAUC-SEP-Windows-EXE
          path: cauc-sep/backend/dist/CAUC-SEP-Backend.exe
          retention-days: 30

      - name: Set build status
        id: build-status
        shell: pwsh
        run: |
          echo "status=success" >> $env:GITHUB_OUTPUT

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          echo "## Windows Build Complete (Nuitka)" >> $env:GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.get-version.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $env:GITHUB_STEP_SUMMARY

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, build-windows]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Check build-windows status
        id: check-build-windows
        run: |
          if [ "${{ needs.build-windows.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Download ZIP artifact
        if: steps.check-build-windows.outputs.status == 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: CAUC-SEP-Windows-ZIP
          path: ./artifacts

      - name: Download EXE artifact
        if: steps.check-build-windows.outputs.status == 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: CAUC-SEP-Windows-EXE
          path: ./artifacts

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
          else
            echo "## Initial Release" > CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Downloads" >> CHANGELOG.md
          echo "- **CAUC-SEP-${{ steps.version.outputs.version }}.zip**: Complete package" >> CHANGELOG.md
          echo "- **CAUC-SEP-Backend.exe**: Standalone executable" >> CHANGELOG.md

      - name: Prepare release files
        id: prepare-files
        run: |
          FILES=""
          ZIP_FILE=$(find artifacts -name "CAUC-SEP-*.zip" -type f 2>/dev/null | head -1)
          if [ -n "$ZIP_FILE" ]; then
            FILES="$FILES $ZIP_FILE"
          fi
          if [ -f "artifacts/CAUC-SEP-Backend.exe" ]; then
            FILES="$FILES artifacts/CAUC-SEP-Backend.exe"
          fi
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
          files: ${{ steps.prepare-files.outputs.files }}

      - name: Release notification
        if: always()
        run: |
          echo "## Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
