# ============================================================================
# CAUC-SEP Backend MyPy Configuration
# ============================================================================
#
# File: mypy.ini
# Path: d:\cauc-sep\backend\mypy.ini
# Version: v0.4.1
# Last Updated: 2026-03-16
#
# ============================================================================

[mypy]
python_version = 3.13
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = false
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Core modules - strict type checking
[mypy-core.abstract]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-core.types]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-core.dm2c_driver]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-core.electromagnet_driver]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-core.temperature_controller]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-core.piezo_controller]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-core.picoammeter]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-schemas.api]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-schemas.validators]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Third-party libraries - ignore missing imports
[mypy-numpy.*]
ignore_missing_imports = true

[mypy-scipy.*]
ignore_missing_imports = true

[mypy-lmfit.*]
ignore_missing_imports = true

[mypy-pymodbus.*]
ignore_missing_imports = true

[mypy-sqlalchemy.*]
ignore_missing_imports = true

[mypy-fastapi.*]
ignore_missing_imports = true

[mypy-pydantic.*]
ignore_missing_imports = true

[mypy-uvicorn.*]
ignore_missing_imports = true

[mypy-h5py.*]
ignore_missing_imports = true

[mypy-matplotlib.*]
ignore_missing_imports = true

[mypy-redis.*]
ignore_missing_imports = true

[mypy-msgpack.*]
ignore_missing_imports = true

[mypy-psutil.*]
ignore_missing_imports = true

[mypy-jose.*]
ignore_missing_imports = true

[mypy-passlib.*]
ignore_missing_imports = true

[mypy-structlog.*]
ignore_missing_imports = true

# Test modules - relaxed checking
[mypy-tests.*]
ignore_errors = true
ignore_missing_imports = true
