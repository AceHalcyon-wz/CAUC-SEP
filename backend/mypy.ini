# ============================================================================
# CAUC-SEP 后端 MyPy 类型检查配置
# ============================================================================
#
# 文件名: mypy.ini
# 路径: d:\cauc-sep\backend\mypy.ini
# 功能: MyPy静态类型检查工具配置
# 版本: v0.3.0
# 创建日期: 2024-01-20
# 最后更新: 2026-03-14
#
# 说明:
#   本配置文件定义了MyPy类型检查器的配置，包含：
#   - Python版本设置
#   - 类型检查严格程度
#   - 模块特定配置
#
# 使用方法:
#   mypy .
#   mypy --config-file mypy.ini .
#
# 官方文档: https://mypy.readthedocs.io/
# ============================================================================

# ==================== 全局配置 ====================
[mypy]
python_version = 3.11                # 目标Python版本
strict = true                        # 启用严格模式

# 严格模式包含以下检查：
# - disallow_any_generics: 禁止使用无类型参数的泛型
# - disallow_untyped_calls: 禁止调用无类型注解的函数
# - disallow_untyped_defs: 禁止定义无类型注解的函数
# - disallow_incomplete_defs: 禁止不完整的类型注解
# - check_untyped_defs: 检查无类型注解函数的内部
# - disallow_untyped_decorators: 禁止无类型注解的装饰器
# - no_implicit_optional: 禁止隐式Optional类型
# - warn_redundant_casts: 警告冗余的类型转换
# - warn_unused_ignores: 警告未使用的类型忽略
# - warn_return_any: 警告返回Any类型
# - no_implicit_reexport: 禁止隐式重新导出
# - strict_equality: 严格相等性检查

# ==================== 模块特定配置 ====================
# NumPy模块配置
# NumPy的类型存根不完整，需要忽略错误
[mypy-numpy]
ignore_errors = true

[mypy-numpy.typing]
ignore_errors = true

# ==================== 第三方库配置 ====================
# 以下第三方库缺少类型存根，需要忽略
# 注意：这些配置也可以在pyproject.toml中统一配置

[mypy-scipy.*]
ignore_errors = true

[mypy-lmfit.*]
ignore_errors = true

[mypy-pymodbus.*]
ignore_errors = true

[mypy-sqlalchemy.*]
ignore_errors = true

[mypy-fastapi.*]
ignore_errors = true

[mypy-pydantic.*]
ignore_errors = true

[mypy-uvicorn.*]
ignore_errors = true

[mypy-h5py.*]
ignore_errors = true

[mypy-matplotlib.*]
ignore_errors = true

[mypy-redis.*]
ignore_errors = true

[mypy-msgpack.*]
ignore_errors = true

[mypy-psutil.*]
ignore_errors = true

[mypy-jose.*]
ignore_errors = true

[mypy-passlib.*]
ignore_errors = true

# ==================== 测试模块配置 ====================
# 测试代码可以放宽类型检查
[mypy-tests.*]
ignore_errors = true
