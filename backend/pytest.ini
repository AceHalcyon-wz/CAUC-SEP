# ============================================================================
# CAUC-SEP 后端 Pytest 测试配置
# ============================================================================
#
# 文件名: pytest.ini
# 路径: d:\cauc-sep\backend\pytest.ini
# 功能: Pytest测试框架配置
# 版本: v0.3.0
# 创建日期: 2024-01-20
# 最后更新: 2026-03-16
#
# 说明:
#   本配置文件定义了Pytest测试框架的配置，包含：
#   - 测试文件发现规则
#   - 异步测试配置
#   - 测试标记定义
#   - 覆盖率配置
#
# 使用方法:
#   pytest                    # 运行所有测试
#   pytest -v                 # 详细输出
#   pytest -m "not slow"      # 排除慢速测试
#   pytest --cov=.            # 生成覆盖率报告
#
# 官方文档: https://docs.pytest.org/
# ============================================================================

# ==================== Pytest 配置 ====================
[tool:pytest]
# 测试文件发现配置
testpaths = tests                   # 测试文件搜索路径
python_files = test_*.py            # 测试文件命名模式
python_classes = Test*              # 测试类命名模式
python_functions = test_*           # 测试函数命名模式

# 异步测试配置
# auto: 自动检测异步测试函数
asyncio_mode = auto

# 警告过滤器
# 忽略特定类型的警告，避免测试输出污染
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning

# 测试标记定义
# 用于分类和筛选测试用例
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    windows: marks tests that only run on Windows
    hardware: marks tests that require hardware connection

# 命令行选项
# 默认添加的命令行参数
addopts =
    -v                              # 详细输出
    --tb=short                      # 简短的回溯信息
    --strict-markers                # 严格标记检查
    -ra                             # 显示所有测试结果摘要
    --asyncio-mode=auto             # 自动检测异步测试
    --cov=.                         # 启用覆盖率
    --cov-report=term-missing       # 终端报告显示未覆盖行
    --cov-report=html               # HTML报告
    --cov-report=xml                # XML报告
    --cov-fail-under=80             # 覆盖率低于80%时失败

# ==================== Coverage 配置 ====================
# 代码覆盖率测量配置
[coverage:run]
source = .                          # 测量覆盖率的源代码路径
branch = true                       # 启用分支覆盖
omit =
    tests/*                         # 排除测试文件
    */__pycache__/*                 # 排除缓存
    */site-packages/*               # 排除第三方包
    */migrations/*                  # 排除迁移文件
    */examples/*                    # 排除示例代码
    main.py                         # 排除入口文件
    scripts/*                       # 排除脚本

[coverage:report]
precision = 2                       # 百分比精度
show_missing = True                 # 显示未覆盖的行
skip_covered = False                # 不跳过已覆盖的文件
fail_under = 80                     # 覆盖率低于80%时失败

# 排除覆盖的代码行
exclude_lines =
    pragma: no cover                # 手动排除标记
    def __repr__                    # 字符串表示方法
    raise AssertionError            # 断言错误
    raise NotImplementedError       # 未实现方法
    if __name__ == .__main__.:      # 主程序入口
    if TYPE_CHECKING:               # 类型检查条件
    @abstractmethod                 # 抽象方法
    @abc.abstractmethod             # 抽象方法（abc模块）

[coverage:html]
directory = htmlcov                 # HTML报告输出目录
title = CAUC-SEP Backend Coverage Report

[coverage:xml]
output = coverage.xml               # XML报告输出路径

[coverage:json]
output = coverage.json              # JSON报告输出路径
pretty_print = true                 # 格式化输出
