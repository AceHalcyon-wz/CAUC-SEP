# ============================================================================
# CAUC-SEP 后端 Pytest 测试配置 v2.0
# ============================================================================
#
# 文件名: pytest.ini
# 路径: d:\cauc-sep\backend\pytest.ini
# 功能: Pytest测试框架配置
# 版本: v2.0
# 创建日期: 2024-01-20
# 最后更新: 2026-03-25
# 作者: DevOps Engineer Agent
#
# 配置说明:
#   1. 测试发现规则
#   2. 异步测试配置
#   3. 覆盖率阈值（80%）
#   4. 测试标记定义
#   5. 报告生成配置
#
# 使用方法:
#   pytest                    # 运行所有测试
#   pytest -v                 # 详细输出
#   pytest -m "not slow"      # 排除慢速测试
#   pytest --cov=.            # 生成覆盖率报告
#   pytest --cov-fail-under=80  # 覆盖率低于80%失败
#
# 官方文档: https://docs.pytest.org/
# ============================================================================

# ==================== Pytest 配置 ====================
[pytest]
# 测试文件发现配置
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 异步测试配置
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 警告过滤器
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# 测试标记定义
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    windows: marks tests that only run on Windows
    hardware: marks tests that require hardware connection
    smoke: marks tests as smoke tests (critical path)
    regression: marks tests as regression tests

# 命令行选项
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    -ra
    --asyncio-mode=auto
    --cov=.
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=json:coverage.json
    --cov-fail-under=80
    --cov-branch
    --durations=10
    --durations-min=1.0

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %H:%M:%S

log_file = tests/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ==================== Coverage 配置 ====================
[coverage:run]
source = .
branch = true
parallel = true
omit =
    tests/*
    */__pycache__/*
    */site-packages/*
    */migrations/*
    */examples/*
    main.py
    scripts/*
    */conftest.py

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
sort = Cover
fail_under = 80

exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    if sys.platform
    if __debug__:
    pass
    \.\.\.

partial_branches =
    pragma: no branch
    if TYPE_CHECKING:

[coverage:html]
directory = htmlcov
title = CAUC-SEP Backend Coverage Report
show_contexts = true

[coverage:xml]
output = coverage.xml

[coverage:json]
output = coverage.json
pretty_print = true
show_contexts = true
