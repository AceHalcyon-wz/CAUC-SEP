# ==============================================================================
# 文件名: prometheus.yml
# 路径: backend/monitoring/prometheus/
# 功能: Prometheus主配置文件
# 描述: 配置Prometheus服务器的全局参数、告警规则、抓取目标等核心设置
# 作者: CAUC-SEP运维团队
# 创建日期: 2024-03-06
# 最后更新: 2024-03-06
# 依赖: Prometheus 2.45+
# ==============================================================================
#
# 配置结构说明:
# - global: 全局配置，影响所有抓取目标和规则评估
#   - scrape_interval: 默认抓取间隔
#   - evaluation_interval: 规则评估间隔
#   - scrape_timeout: 抓取超时时间
#   - external_labels: 外部标签，用于联邦集群或远程存储
# - alerting: 告警管理器配置
#   - alertmanagers: Alertmanager实例列表
# - rule_files: 告警规则文件列表
# - scrape_configs: 抓取配置列表
#   - job_name: 任务名称
#   - static_configs: 静态目标配置
#   - metrics_path: 指标路径
#   - scrape_interval: 该任务的抓取间隔（覆盖全局配置）
#   - scrape_timeout: 该任务的抓取超时（覆盖全局配置）
#
# 抓取目标说明:
# - prometheus: Prometheus自监控，监控自身运行状态
# - cauc-sep-backend: CAUC-SEP后端应用，暴露业务指标
# - node-exporter: 系统级监控，采集CPU、内存、磁盘等指标
# - cadvisor: 容器监控，采集容器资源使用情况
#
# 使用方式:
# 1. 启动Prometheus时通过 --config.file 参数指定此文件
# 2. 修改配置后通过 POST /-/reload 热重载
# 3. 通过 Prometheus UI 查看配置和目标状态
#
# 注意事项:
# - scrape_interval 应根据指标变化频率合理设置
# - scrape_timeout 必须小于 scrape_interval
# - 生产环境建议配置远程存储以实现数据持久化
# ==============================================================================

# ==============================================================================
# 全局配置
# ==============================================================================
global:
  # 默认抓取间隔
  # 所有job的默认抓取频率，可被单个job覆盖
  scrape_interval: 15s
  
  # 规则评估间隔
  # 告警规则的评估频率
  evaluation_interval: 15s
  
  # 抓取超时时间
  # 必须小于 scrape_interval
  scrape_timeout: 10s

  # 外部标签
  # 用于标识数据来源，在联邦集群或远程存储场景中使用
  external_labels:
    monitor: 'cauc-sep-monitor'           # 监控系统标识
    environment: 'production'             # 环境标识（production/staging/development）

# ==============================================================================
# 告警管理器配置
# 配置Alertmanager用于告警通知和路由
# ==============================================================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # Alertmanager服务地址（需取消注释启用）
          # - alertmanager:9093

# ==============================================================================
# 告警规则文件
# 定义告警规则文件的路径
# ==============================================================================
rule_files:
  # 告警规则文件路径（需取消注释启用）
  # - "alert_rules.yml"

# ==============================================================================
# 抓取配置
# 定义需要监控的目标服务
# ==============================================================================
scrape_configs:
  # --------------------------------------------------------------------------
  # Prometheus自监控
  # 监控Prometheus自身的运行状态和性能指标
  # --------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']       # Prometheus自身地址
    metrics_path: /metrics                # 指标端点路径
    scrape_interval: 30s                  # 每30秒抓取一次

  # --------------------------------------------------------------------------
  # CAUC-SEP后端应用监控
  # 监控CAUC-SEP后端服务的业务指标和性能数据
  # --------------------------------------------------------------------------
  - job_name: 'cauc-sep-backend'
    static_configs:
      - targets: ['host.docker.internal:8000']  # 后端服务地址
        labels:
          service: 'cauc-sep'             # 服务名称标签
          component: 'backend'            # 组件标签
    metrics_path: /api/metrics            # 业务指标端点
    scrape_interval: 15s                  # 每15秒抓取一次
    scrape_timeout: 10s                   # 抓取超时10秒

  # --------------------------------------------------------------------------
  # 节点导出器（系统监控）
  # 采集宿主机的系统级指标：CPU、内存、磁盘、网络等
  # 依赖: 需要部署 node_exporter 服务
  # --------------------------------------------------------------------------
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']   # node_exporter服务地址
        labels:
          service: 'cauc-sep'
          component: 'node'               # 组件标签：节点级监控
    scrape_interval: 30s                  # 每30秒抓取一次

  # --------------------------------------------------------------------------
  # cAdvisor（容器监控）
  # 采集Docker容器的资源使用情况：CPU、内存、网络、IO等
  # 依赖: 需要部署 cAdvisor 服务
  # --------------------------------------------------------------------------
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']        # cAdvisor服务地址
        labels:
          service: 'cauc-sep'
          component: 'container'          # 组件标签：容器级监控
    scrape_interval: 30s                  # 每30秒抓取一次

# ==============================================================================
# 远程写入配置（可选）
# 将监控数据写入远程存储，实现长期存储和联邦查询
# 适用场景: 数据持久化、多集群聚合、长期趋势分析
# ==============================================================================
# remote_write:
#   - url: "http://remote-storage:9201/write"
#     queue_config:
#       max_samples_per_send: 1000        # 每批发送的最大样本数
#       max_shards: 200                   # 最大并发分片数
#       capacity: 2500                    # 队列容量

# ==============================================================================
# 远程读取配置（可选）
# 从远程存储读取历史监控数据
# 适用场景: 历史数据查询、数据迁移、灾备恢复
# ==============================================================================
# remote_read:
#   - url: "http://remote-storage:9201/read"
#     read_recent: true                   # 是否优先读取本地数据
