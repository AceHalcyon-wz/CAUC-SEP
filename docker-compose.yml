# ============================================================================
# CAUC-SEP Docker Compose 配置
# ============================================================================
#
# 文件名: docker-compose.yml
# 路径: d:\cauc-sep\docker-compose.yml
# 功能: 服务编排配置 - 生产环境部署
# 版本: v0.3.0
# 创建日期: 2024-01-20
# 最后更新: 2026-03-14
#
# 说明:
#   本配置文件定义了CAUC-SEP平台的Docker服务编排，包含：
#   - backend: FastAPI后端服务
#   - frontend: Vue3前端服务（Nginx）
#   - redis: Redis缓存服务
#
# 使用方法:
#   启动所有服务: docker-compose up -d
#   停止所有服务: docker-compose down
#   查看服务状态: docker-compose ps
#   查看服务日志: docker-compose logs -f [服务名]
#   重新构建服务: docker-compose up -d --build
#
# 访问地址:
#   - 前端界面: http://localhost:8080
#   - 后端API: http://localhost:8000
#   - API文档: http://localhost:8000/docs
# ============================================================================

services:
  # ==================== 后端服务 ====================
  # FastAPI + Uvicorn 应用服务
  # 提供 REST API 和 WebSocket 接口
  backend:
    # 构建配置
    build:
      context: ./backend              # 构建上下文目录
      dockerfile: Dockerfile          # Dockerfile文件名
      args:
        - PYTHON_VERSION=3.11         # Python版本参数

    # 镜像配置
    image: cauc-sep-backend:latest
    container_name: cauc-sep-backend
    restart: unless-stopped           # 除非手动停止，否则自动重启

    # 环境变量配置
    # 说明：生产环境建议使用 .env 文件管理敏感配置
    environment:
      - APP_ENV=production            # 应用环境：production/development
      - LOG_LEVEL=INFO                # 日志级别：DEBUG/INFO/WARNING/ERROR
      - CORS_ORIGINS=http://localhost,http://localhost:8080,http://frontend:8080
      - DATABASE_URL=sqlite:///data/experiments.db  # 数据库连接URL
      - REDIS_URL=redis://redis:6379/0  # Redis连接URL
      # 硬件配置（生产环境需根据实际情况调整）
      - SIMULATION_MODE=true          # 仿真模式：true时无需硬件连接
      - MOTOR_PORT=COM3               # 电机串口（Windows）
      - ELECTROMAGNET_PORT=COM4       # 电磁铁串口（Windows）

    # 端口映射
    # 格式：主机端口:容器端口
    ports:
      - "8000:8000"                   # HTTP API端口

    # 卷挂载
    # 实现数据持久化和配置共享
    volumes:
      - backend-data:/app/data        # 数据目录（数据库、实验数据）
      - backend-logs:/app/logs        # 日志目录
      - backend-exports:/app/exports  # 导出文件目录
      # 设备挂载（Windows串口直通，生产环境取消注释）
      # - //./COM3://./COM3
      # - //./COM4://./COM4

    # 网络配置
    networks:
      - cauc-sep-network

    # 健康检查配置
    # 用于检测服务是否正常运行
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s                   # 检查间隔
      timeout: 10s                    # 超时时间
      retries: 3                      # 重试次数
      start_period: 40s               # 启动等待时间

    # 资源限制
    # 防止服务占用过多系统资源
    deploy:
      resources:
        limits:
          cpus: "2.0"                 # 最大CPU核心数
          memory: 2G                  # 最大内存
        reservations:
          cpus: "0.5"                 # 最小CPU核心数
          memory: 512M                # 最小内存

    # 依赖服务
    # 确保依赖服务启动后再启动本服务
    depends_on:
      redis:
        condition: service_healthy    # 等待Redis健康检查通过

    # 日志配置
    logging:
      driver: "json-file"             # 日志驱动
      options:
        max-size: "10m"               # 单个日志文件最大大小
        max-file: "5"                 # 最多保留日志文件数

  # ==================== 前端服务 ====================
  # Vue3 + Nginx 静态文件服务
  # 提供Web用户界面
  frontend:
    # 构建配置
    build:
      context: ./frontend             # 构建上下文目录
      dockerfile: Dockerfile          # Dockerfile文件名
      args:
        - NODE_VERSION=18             # Node.js版本参数
        - VITE_API_BASE_URL=/api      # API基础路径
        - VITE_WS_BASE_URL=/ws        # WebSocket基础路径

    # 镜像配置
    image: cauc-sep-frontend:latest
    container_name: cauc-sep-frontend
    restart: unless-stopped           # 除非手动停止，否则自动重启

    # 端口映射
    ports:
      - "8080:8080"                   # HTTP端口

    # 网络配置
    networks:
      - cauc-sep-network

    # 健康检查配置
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s                   # 检查间隔
      timeout: 10s                    # 超时时间
      retries: 3                      # 重试次数
      start_period: 10s               # 启动等待时间

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "1.0"                 # 最大CPU核心数
          memory: 512M                # 最大内存
        reservations:
          cpus: "0.25"                # 最小CPU核心数
          memory: 128M                # 最小内存

    # 依赖服务
    depends_on:
      backend:
        condition: service_healthy    # 等待后端健康检查通过

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== Redis缓存服务 ====================
  # 高性能内存数据库
  # 用于会话存储、缓存、消息队列
  redis:
    # 镜像配置
    image: redis:7-alpine             # 使用Alpine Linux精简镜像
    container_name: cauc-sep-redis
    restart: unless-stopped

    # Redis启动命令配置
    # 参数说明：
    #   appendonly yes: 启用AOF持久化
    #   maxmemory: 最大内存限制
    #   maxmemory-policy: 内存满时的淘汰策略
    #   save: RDB快照保存策略（60秒内至少1000次写入）
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000

    # 端口映射（可选，仅调试时开启）
    # 生产环境建议注释掉，避免外部直接访问
    # ports:
    #   - "6379:6379"

    # 卷挂载
    volumes:
      - redis-data:/data              # Redis数据持久化

    # 网络配置
    networks:
      - cauc-sep-network

    # 健康检查配置
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]  # 使用redis-cli ping检查
      interval: 10s                   # 检查间隔
      timeout: 5s                     # 超时时间
      retries: 5                      # 重试次数
      start_period: 10s               # 启动等待时间

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"                 # 最大CPU核心数
          memory: 512M                # 最大内存
        reservations:
          cpus: "0.1"                 # 最小CPU核心数
          memory: 64M                 # 最小内存

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# ==================== 网络配置 ====================
# 定义Docker网络，实现服务间通信
networks:
  cauc-sep-network:
    driver: bridge                    # 使用桥接网络驱动
    name: cauc-sep-network            # 网络名称
    ipam:
      driver: default                 # IP地址管理驱动
      config:
        - subnet: 172.28.0.0/16       # 子网地址范围

# ==================== 卷配置 ====================
# 定义持久化存储卷
volumes:
  # 后端数据卷
  backend-data:
    name: cauc-sep-backend-data
    driver: local                     # 使用本地驱动

  # 后端日志卷
  backend-logs:
    name: cauc-sep-backend-logs
    driver: local

  # 后端导出文件卷
  backend-exports:
    name: cauc-sep-backend-exports
    driver: local

  # Redis数据卷
  redis-data:
    name: cauc-sep-redis-data
    driver: local
