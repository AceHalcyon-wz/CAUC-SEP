# CAUC-SEP 项目根配置
# 统一管理项目的代码质量工具配置

[project]
name = "cauc-sep"
version = "0.1.0"
description = "CAUC-SEP 实验设备控制平台"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "CAUC-SEP Team" }
]
keywords = ["experiment", "control", "hardware", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# ==================== Black 代码格式化 ====================
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
    | node_modules
)/
'''

# ==================== isort 导入排序 ====================
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["core", "api", "models", "drivers", "middleware"]
known_third_party = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "numpy",
    "scipy",
    "pytest",
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip = [".git", ".hg", ".mypy_cache", ".tox", ".venv", "migrations"]

# ==================== MyPy 类型检查 ====================
[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "pymodbus.*",
    "scipy.*",
    "lmfit.*",
    "numpy.*",
    "pytest.*",
    "sqlalchemy.*",
    "fastapi.*",
    "pydantic.*",
    "uvicorn.*",
    "tests.*",
]
ignore_missing_imports = true
ignore_errors = true

# ==================== Ruff 代码检查 ====================
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "migrations",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "RUF",    # Ruff-specific rules
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
]
ignore = [
    "B008",   # FastAPI Depends in argument defaults is standard practice
    "B904",   # raise ... from is not always necessary
    "B028",   # stacklevel in warnings.warn is optional
    "N803",   # Argument name should be lowercase (Ms is standard in physics)
    "N806",   # Variable in function should be lowercase (L is standard in physics)
    "E501",   # line too long (handled by black)
    "RUF001", # String contains ambiguous character
    "RUF002", # Docstring contains ambiguous character
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "C901"]
"migrations/*" = ["E501", "B"]

# ==================== Pytest 测试配置 ====================
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::RuntimeWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "windows: marks tests that only run on Windows",
    "hardware: marks tests that require hardware connection",
]

# ==================== Coverage 覆盖率配置 ====================
[tool.coverage.run]
source = ["backend/core", "backend/api"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/migrations/*",
    "*/examples/*",
    "*/docs/*",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "if sys.platform",
]
fail_under = 70

[tool.coverage.html]
directory = "htmlcov"
title = "CAUC-SEP Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

# ==================== Bandit 安全检查 ====================
[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101", "B601"]

# ==================== 项目脚本 ====================
[project.scripts]
cauc-sep-server = "backend.main:main"

# ==================== 依赖组 ====================
[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.0",
]
