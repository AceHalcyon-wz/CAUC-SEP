/**
 * @file test-config-display.html
 * @path tests/
 * @description 测试配置页面显示的独立HTML文件
 * @author Frontend Engineer Agent
 * @date 2026-03-08
 */

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配置页面测试</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }
    
    .test-container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    h1 {
      color: #333;
      border-bottom: 2px solid #409eff;
      padding-bottom: 10px;
    }
    
    .test-result {
      margin: 20px 0;
      padding: 15px;
      border-radius: 4px;
    }
    
    .success {
      background-color: #f0f9ff;
      border-left: 4px solid #67c23a;
    }
    
    .error {
      background-color: #fef0f0;
      border-left: 4px solid #f56c6c;
    }
    
    .info {
      background-color: #f4f4f5;
      border-left: 4px solid #909399;
    }
    
    .config-item {
      margin: 10px 0;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 4px;
    }
    
    .config-label {
      font-weight: bold;
      color: #606266;
    }
    
    .config-value {
      color: #409eff;
      margin-left: 10px;
    }
    
    .category {
      margin: 20px 0;
      padding: 15px;
      background: #ecf5ff;
      border-radius: 4px;
    }
    
    .category-title {
      font-size: 18px;
      font-weight: bold;
      color: #409eff;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>系统配置页面测试</h1>
    
    <div id="test-results"></div>
    
    <div id="config-display"></div>
  </div>

  <script>
    // 模拟配置数据
    const mockConfig = {
      general: {
        systemName: '自旋电子实验平台',
        language: 'zh-CN',
        theme: 'light',
        samplingRate: 100,
        refreshInterval: 1000,
        logLevel: 'info'
      },
      device: {
        defaultDevice: 'stepper_01',
        connectionTimeout: 5000,
        retryAttempts: 3,
        autoReconnect: true,
        heartbeatInterval: 5000
      },
      network: {
        apiBaseUrl: 'http://localhost:8000',
        websocketUrl: 'ws://localhost:8000/ws',
        requestTimeout: 30000,
        maxConnections: 10
      },
      security: {
        enableSafetyMonitor: true,
        temperatureLimit: 80,
        currentLimit: 10.0,
        voltageLimit: 100,
        enableEmergencyStop: true,
        autoShutdown: false
      },
      data: {
        autoSave: true,
        autoSaveInterval: 60000,
        dataRetentionDays: 30,
        backupPath: '/backup/experiments',
        compressionFormat: 'zip',
        maxStorageSize: 10240
      }
    };

    const configCategories = [
      { id: 'general', name: '通用配置', description: '系统基础参数配置' },
      { id: 'device', name: '设备配置', description: '设备连接与通信配置' },
      { id: 'network', name: '网络配置', description: '网络通信与API配置' },
      { id: 'security', name: '安全配置', description: '安全监控与保护配置' },
      { id: 'data', name: '数据管理', description: '数据存储与备份配置' }
    ];

    const configLabels = {
      systemName: '系统名称',
      language: '系统语言',
      theme: '界面主题',
      samplingRate: '采样频率',
      refreshInterval: '数据刷新间隔',
      logLevel: '日志级别',
      defaultDevice: '默认设备',
      connectionTimeout: '连接超时',
      retryAttempts: '重试次数',
      autoReconnect: '自动重连',
      heartbeatInterval: '设备心跳',
      apiBaseUrl: 'API地址',
      websocketUrl: 'WebSocket地址',
      requestTimeout: '请求超时',
      maxConnections: '最大连接数',
      enableSafetyMonitor: '安全监控',
      temperatureLimit: '温度上限',
      currentLimit: '电流上限',
      voltageLimit: '电压上限',
      enableEmergencyStop: '紧急停止',
      autoShutdown: '自动关机',
      autoSave: '自动保存',
      autoSaveInterval: '保存间隔',
      dataRetentionDays: '数据保留',
      backupPath: '备份路径',
      compressionFormat: '压缩格式',
      maxStorageSize: '最大存储空间'
    };

    // 测试函数
    function runTests() {
      const resultsDiv = document.getElementById('test-results');
      const configDiv = document.getElementById('config-display');
      
      let testResults = [];
      
      // 测试1: 检查配置数据是否存在
      const hasConfig = mockConfig && Object.keys(mockConfig).length > 0;
      testResults.push({
        name: '配置数据检查',
        success: hasConfig,
        message: hasConfig ? '配置数据存在且不为空' : '配置数据不存在或为空'
      });
      
      // 测试2: 检查配置分类是否存在
      const hasCategories = configCategories && configCategories.length > 0;
      testResults.push({
        name: '配置分类检查',
        success: hasCategories,
        message: hasCategories ? `找到 ${configCategories.length} 个配置分类` : '配置分类不存在或为空'
      });
      
      // 测试3: 检查每个分类是否有配置项
      let allCategoriesHaveItems = true;
      configCategories.forEach(category => {
        const items = mockConfig[category.id];
        if (!items || Object.keys(items).length === 0) {
          allCategoriesHaveItems = false;
        }
      });
      testResults.push({
        name: '配置项检查',
        success: allCategoriesHaveItems,
        message: allCategoriesHaveItems ? '所有分类都有配置项' : '部分分类缺少配置项'
      });
      
      // 渲染测试结果
      resultsDiv.innerHTML = testResults.map(result => `
        <div class="test-result ${result.success ? 'success' : 'error'}">
          <strong>${result.name}:</strong> ${result.message}
        </div>
      `).join('');
      
      // 渲染配置显示
      let configHTML = '<h2>配置项展示</h2>';
      
      configCategories.forEach(category => {
        const items = mockConfig[category.id];
        if (items) {
          configHTML += `
            <div class="category">
              <div class="category-title">${category.name}</div>
              <p style="color: #909399; margin-bottom: 15px;">${category.description}</p>
              ${Object.keys(items).map(key => `
                <div class="config-item">
                  <span class="config-label">${configLabels[key] || key}:</span>
                  <span class="config-value">${formatValue(items[key])}</span>
                </div>
              `).join('')}
            </div>
          `;
        }
      });
      
      configDiv.innerHTML = configHTML;
    }
    
    function formatValue(value) {
      if (typeof value === 'boolean') {
        return value ? '启用' : '禁用';
      }
      if (typeof value === 'number') {
        return value.toLocaleString();
      }
      return value;
    }
    
    // 运行测试
    runTests();
  </script>
</body>
</html>
