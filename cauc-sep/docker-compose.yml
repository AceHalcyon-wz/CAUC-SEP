# ============================================================================
# CAUC-SEP Docker Compose Configuration
# 服务编排 - 生产环境部署
# ============================================================================

services:
  # ==================== 后端服务 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=3.11
    image: cauc-sep-backend:latest
    container_name: cauc-sep-backend
    restart: unless-stopped

    # 环境变量配置
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost,http://localhost:8080,http://frontend:8080
      - DATABASE_URL=sqlite:///data/experiments.db
      - REDIS_URL=redis://redis:6379/0
      # 硬件配置（生产环境需调整）
      - SIMULATION_MODE=true
      - MOTOR_PORT=COM3
      - ELECTROMAGNET_PORT=COM4

    # 端口映射
    ports:
      - "8000:8000"

    # 卷挂载
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
      - backend-exports:/app/exports
      # 设备挂载（Windows串口）
      # - //./COM3://./COM3
      # - //./COM4://./COM4

    # 网络配置
    networks:
      - cauc-sep-network

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    # 依赖服务
    depends_on:
      redis:
        condition: service_healthy

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ==================== 前端服务 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_VERSION=18
        - VITE_API_BASE_URL=/api
        - VITE_WS_BASE_URL=/ws
    image: cauc-sep-frontend:latest
    container_name: cauc-sep-frontend
    restart: unless-stopped

    # 端口映射
    ports:
      - "8080:8080"

    # 网络配置
    networks:
      - cauc-sep-network

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    # 依赖服务
    depends_on:
      backend:
        condition: service_healthy

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== Redis缓存服务 ====================
  redis:
    image: redis:7-alpine
    container_name: cauc-sep-redis
    restart: unless-stopped

    # Redis配置
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000

    # 端口映射（可选，仅调试时开启）
    # ports:
    #   - "6379:6379"

    # 卷挂载
    volumes:
      - redis-data:/data

    # 网络配置
    networks:
      - cauc-sep-network

    # 健康检查
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# ==================== 网络配置 ====================
networks:
  cauc-sep-network:
    driver: bridge
    name: cauc-sep-network
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

# ==================== 卷配置 ====================
volumes:
  backend-data:
    name: cauc-sep-backend-data
    driver: local

  backend-logs:
    name: cauc-sep-backend-logs
    driver: local

  backend-exports:
    name: cauc-sep-backend-exports
    driver: local

  redis-data:
    name: cauc-sep-redis-data
    driver: local
