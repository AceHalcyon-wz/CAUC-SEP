# CAUC-SEP Codecov配置
# 配置测试覆盖率报告和状态检查

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

# 覆盖率目标配置
coverage:
  precision: 2
  round: down
  range: "70...100"

  # 状态检查配置
  status:
    # 项目整体覆盖率
    project:
      default:
        target: 70%
        threshold: 5%
        if_ci_failed: error
        informational: false
        only_pulls: false

      # 后端覆盖率
      backend:
        target: 75%
        threshold: 5%
        flags:
          - backend-unit
          - backend-integration
        paths:
          - backend/core
          - backend/api

      # 前端覆盖率
      frontend:
        target: 60%
        threshold: 10%
        flags:
          - frontend
        paths:
          - frontend/src

    # PR覆盖率变化
    patch:
      default:
        target: 70%
        threshold: 5%
        base: auto
        if_ci_failed: error
        informational: false
        only_pulls: true

# 注释配置
comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true
  hide_project_coverage: false

# 忽略路径
ignore:
  - "**/tests/**"
  - "**/test_*.py"
  - "**/__pycache__/**"
  - "**/migrations/**"
  - "**/examples/**"
  - "**/docs/**"
  - "**/node_modules/**"
  - "**/*.min.js"
  - "**/vendor/**"
  - "**/dist/**"
  - "**/build/**"

# 标志配置
flags:
  backend-unit:
    paths:
      - backend/core
      - backend/api
    carryforward: true

  backend-integration:
    paths:
      - backend/core
      - backend/api
    carryforward: true

  frontend:
    paths:
      - frontend/src
    carryforward: true

# GitHub检查配置
github_checks:
  annotations: true

# 解析器配置
parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      method: false
      macro: false
