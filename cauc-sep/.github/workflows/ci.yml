# CAUC-SEP CI工作流配置
# 触发条件：push到main/develop分支，Pull Request
# 功能：代码检查、单元测试、测试覆盖率、Docker镜像构建验证

name: CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== 后端代码检查 ====================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install black isort mypy ruff

      - name: Black格式检查
        run: black --check --diff .

      - name: isort导入排序检查
        run: isort --check-only --diff .

      - name: Ruff代码检查
        run: ruff check .

      - name: MyPy类型检查
        run: mypy --config-file pyproject.toml .
        continue-on-error: true

  # ==================== 后端单元测试 ====================
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest-cov pytest-asyncio

      - name: 运行单元测试
        run: |
          pytest tests/unit -v \
            --cov=core \
            --cov=api \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=html:htmlcov-unit \
            --cov-fail-under=0 \
            -m "not slow and not integration and not windows"

      - name: 上传单元测试覆盖率
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage-unit.xml
          flags: backend-unit
          name: backend-unit-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==================== 后端集成测试 ====================
  backend-integration:
    name: Backend Integration Test
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest-cov pytest-asyncio

      - name: 运行集成测试
        run: |
          pytest tests/integration -v \
            --cov=core \
            --cov=api \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=html:htmlcov-integration \
            --cov-fail-under=0 \
            -m "not slow and not windows" || true
        continue-on-error: true

      - name: 上传集成测试覆盖率
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage-integration.xml
          flags: backend-integration
          name: backend-integration-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==================== 前端代码检查 ====================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: ESLint检查
        run: npm run lint || npx eslint . --ext .vue,.js,.jsx,.cjs,.mjs --ignore-path .gitignore
        continue-on-error: true

      - name: Prettier格式检查
        run: npx prettier --check "src/**/*.{js,vue,css,scss,json}" || true
        continue-on-error: true

  # ==================== 前端单元测试 ====================
  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试
        run: npm run test:coverage

      - name: 上传测试覆盖率
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==================== Docker镜像构建验证 ====================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建后端Docker镜像
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建前端Docker镜像
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 测试结果汇总 ====================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-test, backend-integration, frontend-test]
    if: always()

    steps:
      - name: 检查测试结果
        run: |
          echo "## 测试结果汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 模块 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 后端单元测试 | ${{ needs.backend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 后端集成测试 | ${{ needs.backend-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端单元测试 | ${{ needs.frontend-test.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: 判断整体状态
        if: contains(needs.*.result, 'failure')
        run: exit 1
