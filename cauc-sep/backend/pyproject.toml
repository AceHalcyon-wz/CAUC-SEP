[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pymodbus.*",
    "scipy.*",
    "lmfit.*",
    "numpy.*",
    "pytest.*",
    "sqlalchemy.*",
    "fastapi.*",
    "pydantic.*",
    "uvicorn.*",
    "models",
    "core.data_storage",
    "tests.*",
]
ignore_missing_imports = true
ignore_errors = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = [
    "B008",  # FastAPI Depends in argument defaults is standard practice
    "B904",  # raise ... from is not always necessary
    "B028",  # stacklevel in warnings.warn is optional
    "N803",  # Argument name should be lowercase (Ms is standard in physics)
    "N806",  # Variable in function should be lowercase (L is standard in physics)
    "B007",  # Loop control variable not used (common in tests)
    "E731",  # Lambda expression assignment (common in tests)
    "E501",  # Line too long (handled by black)
    "E402",  # Module level import not at top (common in tests)
    "F841",  # Local variable assigned but never used (common in tests)
    "B017",  # Blind exception assertion (common in tests)
    "C416",  # Unnecessary list comprehension (minor issue)
    "W293",  # Blank line contains whitespace
    "W291",  # Trailing whitespace
    "B027",  # Empty method in abstract base class without abstract decorator
    "UP042",  # Use StrEnum instead of str, Enum
    "B905",  # zip() without strict parameter
    "N818",  # Exception name should have Error suffix
    "N802",  # Function name should be lowercase
    "N801",  # Class name should use CapWords convention
    "F401",  # Imported but unused (common in __init__.py for re-exports)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B007", "E731", "E501", "E402", "F841", "B017", "C416", "F401", "B905"]
"migrations/*" = ["W291", "W293", "E501"]
"docs/*" = ["W293", "W291", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::RuntimeWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "windows: marks tests that only run on Windows",
]

[tool.coverage.run]
source = ["core", "api"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/migrations/*",
    "*/examples/*",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "if sys.platform",
]
fail_under = 70

[tool.coverage.html]
directory = "htmlcov"
title = "CAUC-SEP Backend Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"
