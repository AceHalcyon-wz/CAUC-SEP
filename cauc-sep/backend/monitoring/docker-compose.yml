# Docker Compose配置文件
# 用于部署CAUC-SEP监控栈（Prometheus + Grafana）

version: '3.8'

services:
  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: cauc-sep-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - monitoring
    labels:
      - "service=cauc-sep-monitoring"
      - "component=prometheus"

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:10.0.0
    container_name: cauc-sep-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      # Grafana配置
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=cauc-sep-admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_SERVER_DOMAIN=localhost
      
      # 数据源配置（Prometheus）
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
      
      # 告警配置
      - GF_ALERTING_ENABLED=true
      
      # 匿名访问（可选，生产环境建议关闭）
      # - GF_AUTH_ANONYMOUS_ENABLED=true
      # - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    networks:
      - monitoring
    depends_on:
      - prometheus
    labels:
      - "service=cauc-sep-monitoring"
      - "component=grafana"

  # ==================== Node Exporter（系统监控） ====================
  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: cauc-sep-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring
    labels:
      - "service=cauc-sep-monitoring"
      - "component=node-exporter"

  # ==================== cAdvisor（容器监控） ====================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cauc-sep-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitoring
    labels:
      - "service=cauc-sep-monitoring"
      - "component=cadvisor"

  # ==================== Alertmanager（告警管理） ====================
  # alertmanager:
  #   image: prom/alertmanager:v0.25.0
  #   container_name: cauc-sep-alertmanager
  #   restart: unless-stopped
  #   ports:
  #     - "9093:9093"
  #   volumes:
  #     - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
  #     - alertmanager_data:/alertmanager
  #   command:
  #     - '--config.file=/etc/alertmanager/alertmanager.yml'
  #     - '--storage.path=/alertmanager'
  #   networks:
  #     - monitoring
  #   labels:
  #     - "service=cauc-sep-monitoring"
  #     - "component=alertmanager"

# ==================== 数据卷 ====================
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  # alertmanager_data:
  #   driver: local

# ==================== 网络 ====================
networks:
  monitoring:
    driver: bridge
    name: cauc-sep-monitoring
