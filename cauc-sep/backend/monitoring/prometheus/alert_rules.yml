# Prometheus告警规则配置
# 用于CAUC-SEP系统监控告警

groups:
  # ==================== 系统资源告警 ====================
  - name: system_alerts
    interval: 30s
    rules:
      # CPU使用率告警
      - alert: HighCPUUsage
        expr: cpu_usage_percent > 80
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "CPU使用率过高"
          description: "CPU使用率超过80%，当前值: {{ $value }}%"
          runbook_url: "https://wiki.example.com/runbooks/high-cpu"

      - alert: CriticalCPUUsage
        expr: cpu_usage_percent > 95
        for: 2m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "CPU使用率严重过高"
          description: "CPU使用率超过95%，当前值: {{ $value }}%"
          runbook_url: "https://wiki.example.com/runbooks/critical-cpu"

      # 内存使用率告警
      - alert: HighMemoryUsage
        expr: memory_usage_percent > 80
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "内存使用率过高"
          description: "内存使用率超过80%，当前值: {{ $value }}%"

      - alert: CriticalMemoryUsage
        expr: memory_usage_percent > 95
        for: 2m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "内存使用率严重过高"
          description: "内存使用率超过95%，当前值: {{ $value }}%"

      # 磁盘使用率告警
      - alert: HighDiskUsage
        expr: disk_usage_percent > 85
        for: 10m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "磁盘使用率过高"
          description: "磁盘使用率超过85%，当前值: {{ $value }}%"

      - alert: CriticalDiskUsage
        expr: disk_usage_percent > 95
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "磁盘使用率严重过高"
          description: "磁盘使用率超过95%，当前值: {{ $value }}%"

  # ==================== 设备状态告警 ====================
  - name: device_alerts
    interval: 30s
    rules:
      # 设备断开告警
      - alert: DeviceDisconnected
        expr: devices_disconnected > 0
        for: 1m
        labels:
          severity: warning
          category: device
        annotations:
          summary: "设备断开连接"
          description: "有 {{ $value }} 个设备断开连接"

      # 设备错误告警
      - alert: DeviceError
        expr: devices_error > 0
        for: 30s
        labels:
          severity: error
          category: device
        annotations:
          summary: "设备处于错误状态"
          description: "有 {{ $value }} 个设备处于错误状态"

      # 设备连接率低
      - alert: LowDeviceConnectionRate
        expr: device_connection_rate_percent < 50
        for: 5m
        labels:
          severity: critical
          category: device
        annotations:
          summary: "设备连接率过低"
          description: "设备连接率低于50%，当前值: {{ $value }}%"

  # ==================== 实验状态告警 ====================
  - name: experiment_alerts
    interval: 30s
    rules:
      # 实验失败率告警
      - alert: HighExperimentFailureRate
        expr: |
          (
            rate(cauc_sep_experiments_failed_total[1h])
            /
            (rate(cauc_sep_experiments_completed_total[1h]) + rate(cauc_sep_experiments_failed_total[1h]))
          ) > 0.1
        for: 10m
        labels:
          severity: warning
          category: experiment
        annotations:
          summary: "实验失败率过高"
          description: "过去1小时内实验失败率超过10%"

      # 实验持续时间过长
      - alert: LongRunningExperiment
        expr: cauc_sep_experiments_running > 0 and on() (time() - process_start_time_seconds) > 86400
        for: 1h
        labels:
          severity: warning
          category: experiment
        annotations:
          summary: "实验运行时间过长"
          description: "有实验已运行超过24小时，请检查是否异常"

  # ==================== API性能告警 ====================
  - name: api_alerts
    interval: 30s
    rules:
      # API响应时间告警
      - alert: HighAPILatency
        expr: |
          histogram_quantile(0.95, rate(cauc_sep_api_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          category: api
        annotations:
          summary: "API响应时间过长"
          description: "API P95响应时间超过1秒"

      # API错误率告警
      - alert: HighAPIErrorRate
        expr: |
          (
            sum(rate(cauc_sep_api_requests_by_status_total{status_code=~"5.."}[5m]))
            /
            sum(rate(cauc_sep_api_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          category: api
        annotations:
          summary: "API错误率过高"
          description: "API 5xx错误率超过5%"

  # ==================== 存储告警 ====================
  - name: storage_alerts
    interval: 1m
    rules:
      # 存储使用率告警
      - alert: HighStorageUsage
        expr: cauc_sep_storage_usage_percent > 80
        for: 10m
        labels:
          severity: warning
          category: storage
        annotations:
          summary: "存储使用率过高"
          description: "数据库存储使用率超过80%，当前值: {{ $value }}%"

      # 数据快速增长告警
      - alert: RapidDataGrowth
        expr: |
          rate(cauc_sep_data_records_total[1h]) > 10000
        for: 30m
        labels:
          severity: warning
          category: storage
        annotations:
          summary: "数据增长过快"
          description: "数据记录增长速率超过10000条/小时"

  # ==================== 健康评分告警 ====================
  - name: health_alerts
    interval: 30s
    rules:
      # 健康评分低
      - alert: LowHealthScore
        expr: health_score_overall < 70
        for: 5m
        labels:
          severity: warning
          category: health
        annotations:
          summary: "系统健康评分较低"
          description: "系统健康评分低于70，当前值: {{ $value }}"

      - alert: CriticalHealthScore
        expr: health_score_overall < 50
        for: 2m
        labels:
          severity: critical
          category: health
        annotations:
          summary: "系统健康评分严重过低"
          description: "系统健康评分低于50，当前值: {{ $value }}，请立即检查系统状态"

  # ==================== WebSocket告警 ====================
  - name: websocket_alerts
    interval: 30s
    rules:
      # WebSocket错误告警
      - alert: WebSocketErrors
        expr: rate(cauc_sep_websocket_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          category: websocket
        annotations:
          summary: "WebSocket错误率过高"
          description: "WebSocket错误率超过0.1次/秒"

  # ==================== 告警系统自身监控 ====================
  - name: alerting_system
    interval: 1m
    rules:
      # 活跃告警过多
      - alert: TooManyActiveAlerts
        expr: alerts_active > 10
        for: 5m
        labels:
          severity: warning
          category: alerting
        annotations:
          summary: "活跃告警数量过多"
          description: "当前有 {{ $value }} 个活跃告警，可能存在系统问题"
