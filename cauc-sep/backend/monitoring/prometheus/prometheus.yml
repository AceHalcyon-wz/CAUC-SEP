# Prometheus配置文件
# 用于监控CAUC-SEP系统

global:
  # 抓取间隔
  scrape_interval: 15s
  # 评估规则间隔
  evaluation_interval: 15s
  # 抓取超时
  scrape_timeout: 10s

  # 外部标签（用于联邦集群或远程存储）
  external_labels:
    monitor: 'cauc-sep-monitor'
    environment: 'production'

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# 告警规则文件
rule_files:
  # - "alert_rules.yml"

# 抓取配置
scrape_configs:
  # ==================== Prometheus自监控 ====================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics
    scrape_interval: 30s

  # ==================== CAUC-SEP应用监控 ====================
  - job_name: 'cauc-sep-backend'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'cauc-sep'
          component: 'backend'
    metrics_path: /api/metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # ==================== 节点导出器（系统监控） ====================
  # 需要安装node_exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'cauc-sep'
          component: 'node'
    scrape_interval: 30s

  # ==================== cAdvisor（容器监控） ====================
  # 需要安装cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cauc-sep'
          component: 'container'
    scrape_interval: 30s

# ==================== 远程写入配置（可选） ====================
# remote_write:
#   - url: "http://remote-storage:9201/write"

# ==================== 远程读取配置（可选） ====================
