# Grafana仪表板自动加载配置
# 自动从指定目录加载仪表板JSON文件

apiVersion: 1

providers:
  - name: 'CAUC-SEP Dashboards'
    orgId: 1
    folder: 'CAUC-SEP'
    folderUid: 'cauc-sep'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
