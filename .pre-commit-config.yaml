# ============================================================================
# CAUC-SEP Pre-commit 配置
# ============================================================================
#
# 文件名: .pre-commit-config.yaml
# 路径: d:\cauc-sep\.pre-commit-config.yaml
# 功能: 在git commit前自动执行代码检查和格式化
# 版本: v0.3.0
# 创建日期: 2024-01-20
# 最后更新: 2026-03-14
#
# 说明:
#   本配置文件定义了pre-commit钩子，在每次提交前自动执行：
#   - 通用检查（空白字符、文件格式等）
#   - Python代码检查（Black、isort、Ruff、MyPy）
#   - 安全检查（Bandit）
#   - 前端代码检查（ESLint、Prettier）
#   - Dockerfile检查（hadolint）
#   - 提交信息检查（commitizen）
#
# 安装方法:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type commit-msg
#
# 手动运行:
#   pre-commit run --all-files
# ============================================================================

# ==================== 全局配置 ====================
default_stages: [pre-commit]         # 默认执行阶段
default_language_version:
  python: python3.11                 # 默认Python版本

repos:
  # ==================== 通用检查 ====================
  # pre-commit-hooks: 通用文件检查钩子
  # 官方文档: https://github.com/pre-commit/pre-commit-hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # 删除行尾空白字符
      - id: trailing-whitespace
        name: 删除行尾空白字符
        args: [--markdown-linebreak-ext=md]

      # 确保文件以换行符结尾
      - id: end-of-file-fixer
        name: 确保文件以换行符结尾

      # YAML语法检查
      - id: check-yaml
        name: YAML语法检查
        args: [--unsafe]             # 允许自定义YAML标签

      # JSON语法检查
      - id: check-json
        name: JSON语法检查

      # TOML语法检查
      - id: check-toml
        name: TOML语法检查

      # 检查大文件（防止提交大文件）
      - id: check-added-large-files
        name: 检查大文件
        args: [--maxkb=500]          # 最大500KB

      # 检查文件名大小写冲突（跨平台兼容）
      - id: check-case-conflict
        name: 检查文件名大小写冲突

      # 检查合并冲突标记
      - id: check-merge-conflict
        name: 检查合并冲突标记

      # 检查符号链接有效性
      - id: check-symlinks
        name: 检查符号链接

      # 检测私钥文件（安全检查）
      - id: detect-private-key
        name: 检测私钥文件

      # 统一行尾符为LF
      - id: mixed-line-ending
        name: 统一行尾符
        args: [--fix=lf]

  # ==================== Python代码检查 ====================
  # Black: 不妥协的Python代码格式化工具
  # 官方文档: https://github.com/psf/black
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        name: Black格式化
        args: [--config, pyproject.toml]
        files: ^backend/             # 仅检查backend目录

  # isort: Python导入语句排序工具
  # 官方文档: https://github.com/pycqa/isort
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort导入排序
        args: [--settings-path, pyproject.toml]
        files: ^backend/

  # Ruff: 极速Python代码检查工具
  # 官方文档: https://github.com/astral-sh/ruff-pre-commit
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        name: Ruff代码检查
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/

  # MyPy: Python静态类型检查工具
  # 官方文档: https://github.com/pre-commit/mirrors-mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: MyPy类型检查
        args: [--config-file, pyproject.toml]
        files: ^backend/
        additional_dependencies:
          - pydantic>=2.0
          - types-requests
          - types-redis
        pass_filenames: false
        entry: bash -c 'cd backend && mypy --config-file ../pyproject.toml .'

  # ==================== 安全检查 ====================
  # Bandit: Python代码安全检查工具
  # 官方文档: https://github.com/PyCQA/bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        name: Bandit安全检查
        args: [-c, pyproject.toml]
        files: ^backend/
        additional_dependencies: ["bandit[toml]"]

  # ==================== 前端代码检查 ====================
  # ESLint: JavaScript/Vue代码检查工具
  # 官方文档: https://github.com/pre-commit/mirrors-eslint
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        name: ESLint检查
        files: ^frontend/src/
        types: [javascript, vue]
        args: [--fix, --config, frontend/.eslintrc.cjs]
        additional_dependencies:
          - eslint@8.56.0
          - eslint-plugin-vue@9.20.1
          - "@typescript-eslint/eslint-plugin@6.19.0"
          - "@typescript-eslint/parser@6.19.0"

  # Prettier: 代码格式化工具
  # 官方文档: https://github.com/pre-commit/mirrors-prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: Prettier格式化
        files: ^frontend/src/
        types_or: [javascript, vue, css, scss, json]
        args: [--write, --config, frontend/.prettierrc]

  # ==================== Docker检查 ====================
  # hadolint: Dockerfile语法检查工具
  # 官方文档: https://github.com/hadolint/hadolint
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        name: Dockerfile检查
        args:
          - --ignore
          - DL3008                  # 忽略：apt-get不固定版本警告
          - --ignore
          - DL3009                  # 忽略：apt-get删除缓存警告
          - --ignore
          - DL3015                  # 忽略：apt-get不清理警告

  # ==================== 提交信息检查 ====================
  # commitizen: 提交信息格式检查工具
  # 官方文档: https://github.com/commitizen-tools/commitizen
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.18.0
    hooks:
      - id: commitizen
        name: 提交信息格式检查
        stages: [commit-msg]        # 在commit-msg阶段执行

# ==================== CI配置 ====================
# 用于pre-commit.ci自动修复
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true                  # 自动修复PR
  autoupdate_branch: ''              # 自动更新分支
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly        # 每周自动更新
  skip: []                           # 跳过的钩子
  submodules: false                  # 不处理子模块
