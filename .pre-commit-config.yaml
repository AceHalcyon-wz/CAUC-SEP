# CAUC-SEP Pre-commit配置
# 在git commit前自动执行代码检查和格式化

default_stages: [pre-commit]
default_language_version:
  python: python3.11

repos:
  # ==================== 通用检查 ====================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: 删除行尾空白字符
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        name: 确保文件以换行符结尾
      - id: check-yaml
        name: YAML语法检查
        args: [--unsafe]
      - id: check-json
        name: JSON语法检查
      - id: check-toml
        name: TOML语法检查
      - id: check-added-large-files
        name: 检查大文件
        args: [--maxkb=500]
      - id: check-case-conflict
        name: 检查文件名大小写冲突
      - id: check-merge-conflict
        name: 检查合并冲突标记
      - id: check-symlinks
        name: 检查符号链接
      - id: detect-private-key
        name: 检测私钥文件
      - id: mixed-line-ending
        name: 统一行尾符
        args: [--fix=lf]

  # ==================== Python代码检查 ====================
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        name: Black格式化
        args: [--config, pyproject.toml]
        files: ^backend/

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort导入排序
        args: [--settings-path, pyproject.toml]
        files: ^backend/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        name: Ruff代码检查
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: MyPy类型检查
        args: [--config-file, pyproject.toml]
        files: ^backend/
        additional_dependencies:
          - pydantic>=2.0
          - types-requests
          - types-redis
        pass_filenames: false
        entry: bash -c 'cd backend && mypy --config-file ../pyproject.toml .'

  # ==================== 安全检查 ====================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        name: Bandit安全检查
        args: [-c, pyproject.toml]
        files: ^backend/
        additional_dependencies: ["bandit[toml]"]

  # ==================== 前端代码检查 ====================
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        name: ESLint检查
        files: ^frontend/src/
        types: [javascript, vue]
        args: [--fix, --config, frontend/.eslintrc.cjs]
        additional_dependencies:
          - eslint@8.56.0
          - eslint-plugin-vue@9.20.1
          - "@typescript-eslint/eslint-plugin@6.19.0"
          - "@typescript-eslint/parser@6.19.0"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: Prettier格式化
        files: ^frontend/src/
        types_or: [javascript, vue, css, scss, json]
        args: [--write, --config, frontend/.prettierrc]

  # ==================== Docker检查 ====================
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        name: Dockerfile检查
        args: [--ignore, DL3008, --ignore, DL3009, --ignore, DL3015]

  # ==================== 提交信息检查 ====================
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.18.0
    hooks:
      - id: commitizen
        name: 提交信息格式检查
        stages: [commit-msg]

# ==================== 全局配置 ====================
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
