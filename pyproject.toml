# ============================================================================
# CAUC-SEP 项目根配置
# ============================================================================
#
# 文件名: pyproject.toml
# 路径: d:\cauc-sep\pyproject.toml
# 功能: 项目根配置文件，统一管理代码质量工具配置
# 版本: v0.3.2
# 创建日期: 2024-01-20
# 最后更新: 2026-03-15
#
# 说明:
#   本配置文件遵循 PEP 518 规范，包含以下内容：
#   - 项目元数据（名称、版本、描述等）
#   - Black 代码格式化配置
#   - isort 导入排序配置
#   - MyPy 类型检查配置
#   - Ruff 代码检查配置
#   - Pytest 测试配置
#   - Coverage 覆盖率配置
#   - Bandit 安全检查配置
#
# 使用方法:
#   - 格式化代码: black .
#   - 排序导入: isort .
#   - 类型检查: mypy backend/
#   - 代码检查: ruff check .
#   - 运行测试: pytest
# ============================================================================

# ==================== 项目元数据 ====================
[project]
name = "cauc-sep"
version = "0.3.2"
description = "CAUC-SEP 自旋电子器件实验平台 - 多设备集成控制系统"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "CAUC-SEP Team" }
]
keywords = ["experiment", "control", "hardware", "automation", "spintronics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

# ==================== Black 代码格式化配置 ====================
# Black: 不妥协的Python代码格式化工具
# 官方文档: https://black.readthedocs.io/
[tool.black]
line-length = 100                    # 每行最大字符数（PEP8推荐79，本项目使用100）
target-version = ["py311"]           # 目标Python版本
include = '\.pyi?$'                  # 格式化的文件类型（.py和.pyi文件）
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
    | node_modules
)/
'''

# ==================== isort 导入排序配置 ====================
# isort: Python导入语句排序工具
# 官方文档: https://pycqa.github.io/isort/
[tool.isort]
profile = "black"                    # 与Black兼容的配置
line_length = 100                    # 每行最大字符数
known_first_party = ["core", "api", "models", "drivers", "middleware", "devices", "schemas"]
known_third_party = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "numpy",
    "scipy",
    "pytest",
    "uvicorn",
    "pymodbus",
    "h5py",
    "lmfit",
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip = [".git", ".hg", ".mypy_cache", ".tox", ".venv", "migrations"]

# ==================== MyPy 类型检查配置 ====================
# MyPy: Python静态类型检查工具
# 官方文档: https://mypy.readthedocs.io/
[tool.mypy]
python_version = "3.11"              # 目标Python版本
warn_return_any = false              # 警告返回Any类型的函数
warn_unused_configs = true           # 警告未使用的配置
disallow_untyped_defs = false        # 禁止无类型注解的函数定义（严格模式）
disallow_incomplete_defs = false     # 禁止不完整的类型注解
check_untyped_defs = true            # 检查无类型注解函数的内部类型
ignore_missing_imports = true        # 忽略缺失的导入类型存根
show_error_codes = true              # 显示错误代码
show_column_numbers = true           # 显示列号
show_error_context = true            # 显示错误上下文
pretty = true                        # 美化输出

# MyPy 模块覆盖配置
# 对特定模块放宽类型检查要求
[[tool.mypy.overrides]]
module = [
    "pymodbus.*",
    "scipy.*",
    "lmfit.*",
    "numpy.*",
    "pytest.*",
    "sqlalchemy.*",
    "fastapi.*",
    "pydantic.*",
    "uvicorn.*",
    "tests.*",
]
ignore_missing_imports = true
ignore_errors = true

# ==================== Ruff 代码检查配置 ====================
# Ruff: 极速Python代码检查工具（替代flake8、isort等）
# 官方文档: https://docs.astral.sh/ruff/
[tool.ruff]
line-length = 100                    # 每行最大字符数
target-version = "py311"             # 目标Python版本
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "migrations",
    "node_modules",
]

# Ruff 规则选择
# 规则代码说明:
#   E: pycodestyle错误
#   W: pycodestyle警告
#   F: Pyflakes
#   I: isort
#   N: pep8-naming
#   UP: pyupgrade
#   B: flake8-bugbear
#   C4: flake8-comprehensions
#   DTZ: flake8-datetimez
#   RUF: Ruff特定规则
#   SIM: flake8-simplify
#   TCH: flake8-type-checking
[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "RUF",    # Ruff-specific rules
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
]
ignore = [
    "B008",   # FastAPI Depends in argument defaults is standard practice
    "B904",   # raise ... from is not always necessary
    "B028",   # stacklevel in warnings.warn is optional
    "N803",   # Argument name should be lowercase (Ms is standard in physics)
    "N806",   # Variable in function should be lowercase (L is standard in physics)
    "E501",   # line too long (handled by black)
    "RUF001", # String contains ambiguous character
    "RUF002", # Docstring contains ambiguous character
]

# Ruff 文件特定忽略规则
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "C901"]
"migrations/*" = ["E501", "B"]

# ==================== Pytest 测试配置 ====================
# Pytest: Python测试框架
# 官方文档: https://docs.pytest.org/
[tool.pytest.ini_options]
testpaths = ["backend/tests"]        # 测试文件路径
python_files = ["test_*.py"]         # 测试文件命名模式
python_classes = ["Test*"]           # 测试类命名模式
python_functions = ["test_*"]        # 测试函数命名模式
addopts = "-v --tb=short --strict-markers"  # 默认命令行选项
asyncio_mode = "auto"                # 异步测试模式
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::RuntimeWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "windows: marks tests that only run on Windows",
    "hardware: marks tests that require hardware connection",
]

# ==================== Coverage 覆盖率配置 ====================
# Coverage: Python代码覆盖率测量工具
# 官方文档: https://coverage.readthedocs.io/
[tool.coverage.run]
source = ["backend/core", "backend/api"]  # 测量覆盖率的源代码路径
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/migrations/*",
    "*/examples/*",
    "*/docs/*",
]
branch = true                        # 启用分支覆盖
parallel = true                      # 并行测量

[tool.coverage.report]
precision = 2                        # 百分比精度
show_missing = true                  # 显示未覆盖的行
skip_covered = false                 # 跳过已完全覆盖的文件
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "if sys.platform",
]
fail_under = 70                      # 覆盖率低于70%时失败

[tool.coverage.html]
directory = "htmlcov"                # HTML报告输出目录
title = "CAUC-SEP Coverage Report"   # HTML报告标题

[tool.coverage.xml]
output = "coverage.xml"              # XML报告输出路径

# ==================== Bandit 安全检查配置 ====================
# Bandit: Python代码安全检查工具
# 官方文档: https://bandit.readthedocs.io/
[tool.bandit]
exclude_dirs = ["tests", "migrations"]  # 排除检查的目录
skips = ["B101", "B601"]             # 跳过的检查项
# B101: assert语句检查（测试中常用）
# B601: paramiko调用检查

# ==================== 项目脚本入口 ====================
# 通过 pip install -e . 安装后可直接运行
[project.scripts]
cauc-sep-server = "backend.main:main"  # 启动后端服务器

# ==================== 可选依赖组 ====================
[project.optional-dependencies]
dev = [
    "black>=24.0.0",                 # 代码格式化
    "isort>=5.13.0",                 # 导入排序
    "mypy>=1.8.0",                   # 类型检查
    "ruff>=0.2.0",                   # 代码检查
    "pytest>=8.0.0",                 # 测试框架
    "pytest-cov>=4.1.0",             # 测试覆盖率
    "pytest-asyncio>=0.23.0",        # 异步测试支持
    "pre-commit>=3.6.0",             # Git钩子
    "bandit>=1.7.0",                 # 安全检查
]
