# ========================================
# CAUC-SEP Electron Builder 配置文件
# ========================================
# 版本: 4.0.0
# 作者: CAUC-SEP Team
# 日期: 2024-03-15
# ========================================

appId: com.cauc.sep
productName: CAUC-SEP
copyright: Copyright © 2024 CAUC-SEP Team

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/node_modules/.cache/**/*"
  - "!src/preload.js"

extraResources:
  - from: resources/backend/main.dist
    to: backend/main.dist
    filter:
      - "**/*"
  - from: resources/frontend
    to: frontend
    filter:
      - "**/*"
  - from: ../assets
    to: assets
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: ../assets/icons/icon.ico
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  installerIcon: ../assets/icons/icon.ico
  uninstallerIcon: ../assets/icons/icon.ico
  installerHeaderIcon: ../assets/icons/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CAUC-SEP 科学实验平台
  deleteAppDataOnUninstall: false
  displayLanguageSelector: false
  installerLanguages:
    - zh_CN
    - en_US
  language: "2052"

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: ../assets/icons/icon.png
  category: public.app-category.science
  hardenedRuntime: true
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  icon: ../assets/icons
  category: Science
  artifactName: ${productName}-${version}-${arch}.${ext}
  maintainer: CAUC-SEP Team <team@cauc.edu.cn>

publish: null
compression: maximum
nodeGypRebuild: false
npmRebuild: true
